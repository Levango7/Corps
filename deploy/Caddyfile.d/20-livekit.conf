# =============================================================================
# deploy/Caddyfile.d/20-livekit.conf — LiveKit 站点
# =============================================================================
# 只反代 LiveKit 的 **L7 通道**：7880 的 HTTP API 与 WebSocket 信令。
#
# ⛔ 重要边界：RTC 媒体流（7881/TCP + 50000-50100/UDP 的 RTP）**不经过 Caddy**。
# Caddy 是 L7 HTTP 代理，无法转发 UDP/RTP。docker-compose.prod.yml 里
# livekit.ports 保留了 7881 与 50000-50100 的宿主机映射正是为此——
# 那两个端口是**直接**对公网开放的，不受本文件影响。
#
# 误判风险提示：只配 Caddy 不开媒体端口时，浏览器能连上信令、能看到自己
# 加入房间成功，但**对方看不到画面**。看起来"配置成功"，实际通话不可用。
# 排查通话问题先查这两个端口与防火墙，再查本文件。
# =============================================================================

# LiveKit 未启用（deploy/.env.prod 中 LIVEKIT_API_KEY 为空）时，
# CORPS_LIVEKIT_SITE_ADDRESS 置空字符串，本块退化为不注册任何站点——
# 空 site address 在 Caddy 中是合法的空操作，不会导致启动失败。
{$CORPS_LIVEKIT_SITE_ADDRESS} {
	# 裸名调用 snippet，理由同 10-app.conf（Caddy 的 import 只解析文件路径）
	global_headers

	# LiveKit 的 /rtc 与 /twirp 路径需要 WebSocket 升级与长连接。
	# Caddy 的 reverse_proxy 默认即支持 WebSocket 升级（自动处理
	# Connection/Upgrade 头），无需手工设置。
	handle {
		reverse_proxy {$LIVEKIT_UPSTREAM} {
			header_up X-Real-Ip {remote_host}
			header_up X-Forwarded-Proto {scheme}
			flush_interval -1
		}
	}
}
