# =============================================================================
# deploy/Caddyfile.d/10-app.conf — 主应用站点
# =============================================================================
# 备案期与备案后共用同一份配置，切换只靠一个环境变量 CORPS_SITE_ADDRESS：
#   备案后（默认）= example.com          → Caddy 自动签发并续期 HTTPS
#   备案期         = http://203.0.113.10  → 显式 http:// 前缀关闭自动 HTTPS
# 依据是 Caddy 的既定行为：site address 带显式 http:// 时不申请证书、
# 不做 HTTP→HTTPS 跳转。因此不需要两份 Caddyfile，也不需要条件块
# （Caddyfile 语言本身没有条件语句）。
# =============================================================================

{$CORPS_SITE_ADDRESS} {
	# 上传体积上限：IM 附件走 /api/uploads。
	# Caddy 默认请求体上限约 10MB（2.10 的 server 层默认），超过会在请求到达
	# 应用之前就 413——用户看到"发送失败"而应用日志里什么都没有，极难定位。
	# ⛔ 不可放进全局 `servers {}` 块：Caddy 2.8 起 servers 块不再接受 max_size
	#    （caddy validate 报 "unrecognized servers option 'max_size'"，已实测）。
	#    请求体上限属于站点级配置。
	request_body {
		max_size {$REQUEST_MAX_SIZE:-25MB}
	}

	# 路由顺序：先处理需要拒绝的路径，再放行其余。
	# 顺序有讲究——被 403 的两个端点必须在兜底反代之前匹配，否则请求会被
	# 透明地转给应用，泄露就发生了。
	route {
		# /api/metrics 不对公网暴露：Prometheus 指标含节点内存/运行时信息，属
		# 内部运维数据；且应用侧 METRICS_TOKEN 是可选的，缺失时端点完全开放
		# （runbook §8.2 建议"用网络层限制"，此处把它落成显式规则）。
		# 内网抓取：从服务器本机 curl http://127.0.0.1:3000/api/metrics
		@metrics path /api/metrics
		respond @metrics "metrics endpoint is internal-only" 403

		# /api/health 同理：它会泄露 db 是否在线（探测失败返回 503
		# status=degraded），是免费的数据库状态探测口。健康验证走
		# deploy/scripts/healthcheck.sh 在服务器本地执行。
		@health path /api/health
		respond @health "health endpoint is internal-only; use deploy/scripts/healthcheck.sh" 403

		# 其余全部反代。global_headers 与 proxy_to_app 是 snippet，
		# 只能作为子指令出现（写在 route 块内的 reverse_proxy 同级）。
		handle {
			global_headers
			proxy_to_app
		}
	}

	log {
		output stdout
		format json
		level {$CADDY_LOG_LEVEL:-INFO}
	}
}
