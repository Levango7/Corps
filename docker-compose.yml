# =============================================================================
# Corps 生产部署 docker-compose
# 用法：
#   1. 复制 .env.example 为 .env，填入真实密钥
#   2. docker compose up -d --build
#   3. 访问 http://localhost:3000
# =============================================================================
# 注意：此文件位于项目根目录，构建上下文为 ./web
# =============================================================================

services:
  # ─── PostgreSQL 18 数据库（版本已与 CI、SPEC 对齐，见 docs/runbook-deploy.md §6）───
  db:
    image: postgres:18-alpine
    container_name: corps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 无默认值：未在 .env 设置时 compose 直接报错退出，杜绝带着示例密码上线
      # （历史示例密码曾进版本库，见 docs/runbook-deploy.md §5 密钥轮换要求）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（openssl rand -hex 16）}
      POSTGRES_DB: ${POSTGRES_DB:-corps}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PG18+ 镜像要求数据卷挂载到 /var/lib/postgresql（主版本子目录布局），
      # 不能沿用 PG16 的 /var/lib/postgresql/data，见 docs/runbook-deploy.md §6
      - postgres_data:/var/lib/postgresql
      # 仅首次启动时执行（创建 RLS 辅助函数 schema）
      - ./web/docker/init-rls.sql:/docker-entrypoint-initdb.d/01-init-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-corps}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - corps-net

  # ─── Redis —— 限流共享计数（TC-RATE-05）──────────────────────────────────
  # web/lib/rate-limit.ts 读取 REDIS_URL 启用 Redis 固定窗口原子计数；
  # 多实例水平扩容部署时限流配额必须经 Redis 共享，否则各实例独立计数、配额被稀释。
  # 仅供 app 容器内网访问，不映射宿主机端口。计数键自带 PEXPIRE，无需持久化。
  redis:
    image: redis:8-alpine
    container_name: corps-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - corps-net

  # ─── Next.js 应用 ──────────────────────────────────────────────────────────
  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: corps-web:latest
    container_name: corps-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Redis 共享限流（TC-RATE-05）：多实例共享固定窗口计数，避免配额稀释 ──
      # 单实例可省略（rate-limit.ts 降级为进程内内存限流）；多实例必须配置共享 Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # ── 数据库双连接（审计 F-01/T1.2：应用不再以 postgres 超管运行）──
      # 运行时连接 = corps_app 最小权限角色（受 FORCE RLS 约束）
      DATABASE_URL: postgresql://corps_app:${CORPS_APP_PASSWORD:?请在 .env 中设置 CORPS_APP_PASSWORD（openssl rand -hex 16）}@db:5432/${POSTGRES_DB:-corps}?schema=public
      # 属主连接 = 仅用于容器启动时的 migrate deploy 与 rls-activate.sql，不参与业务请求
      DATABASE_OWNER_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-corps}?schema=public
      # 默认开启 RLS 加固；显式置 false 可退回非加固模式（不推荐）
      RLS_ACTIVATE: ${RLS_ACTIVATE:-true}
      # 认证密钥（必须为强随机值）
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # 应用 URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Stripe（可选，未配置时计费页隐藏升级入口）
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      # 年付价格：年付 checkout 必需（stripe-provider.ts 未配置直接报错）
      STRIPE_PRICE_ID_YEARLY: ${STRIPE_PRICE_ID_YEARLY:-}
      # 国内支付通道（Phase 2）：未配置对应密钥时 isConfigured=false，前端隐藏入口；
      # PAYMENT_PROVIDER 决定 checkout 未显式传 provider 时的默认通道
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      WECHAT_CERT_SERIAL_NO: ${WECHAT_CERT_SERIAL_NO:-}
      WECHAT_PRICE_CENTS_MONTHLY: ${WECHAT_PRICE_CENTS_MONTHLY:-}
      WECHAT_PRICE_CENTS_YEARLY: ${WECHAT_PRICE_CENTS_YEARLY:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      WECHAT_API_BASE: ${WECHAT_API_BASE:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_PRICE_CENTS_MONTHLY: ${ALIPAY_PRICE_CENTS_MONTHLY:-}
      ALIPAY_PRICE_CENTS_YEARLY: ${ALIPAY_PRICE_CENTS_YEARLY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
      # 跨源白名单（可选；未配置时不回 ACAO 头，浏览器 fail-closed）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 定时作业鉴权：截止日提醒 /api/cron/due-reminders 需外部调度器携带
      # Authorization: Bearer ${CRON_SECRET} 调用（本编排不含调度器，需自行配置 cron）
      CRON_SECRET: ${CRON_SECRET:-}
      # 邮件（可选）
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # RLS 运行时角色密码（RLS_ACTIVATE=true 时必填，见 .env.example 生成命令）
      CORPS_APP_PASSWORD: ${CORPS_APP_PASSWORD:?请在 .env 中设置 CORPS_APP_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      # RLS 激活脚本（entrypoint 在 RLS_ACTIVATE=true 时执行）
      - ./db/rls-activate.sql:/app/db/rls-activate.sql:ro
      # IM 附件持久化：容器重建不丢已上传文件（无此卷重启即清空 uploads/）
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - corps-net

volumes:
  postgres_data:
    name: corps-postgres-data
  uploads_data:
    name: corps-uploads-data

networks:
  corps-net:
    name: corps-network
    driver: bridge