name: Mobile Build

# 三端移动端构建 CI（Android APK + iOS IPA + HarmonyOS 准备）
#
# 架构：移动端 WebView → 远程 Next.js 服务器（CORPS_WEB_URL）
# 桌面端仍由 tauri-build.yml 负责（Sidecar 方案）
#
# 触发：手动（可指定 CORPS_WEB_URL）+ version tag push (v*)
# Android：ubuntu-latest + Rust cross targets + Android SDK/NDK → APK
# iOS：macos-latest + Rust iOS targets + Xcode（debug 构建，无签名）→ IPA
# HarmonyOS：标准 CI 无法构建（需 DevEco Studio），仅验证项目结构

on:
  workflow_dispatch:
    inputs:
      corps_web_url:
        description: 'Corps web URL (default: https://corps.com)'
        required: false
        default: 'https://corps.com'
  push:
    tags: ["v*"]

env:
  CORPS_WEB_URL: ${{ github.event.inputs.corps_web_url || 'https://corps.com' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 已预装 Android SDK（/usr/local/lib/android/sdk）
      # 只需安装 NDK 27（Tauri 2 要求 NDK 25+）
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: web

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Prepare mobile config (set CORPS_WEB_URL)
        run: node scripts/prepare-mobile.mjs
        working-directory: desktop

      - name: Initialize Tauri Android project
        run: npx tauri android init
        working-directory: desktop

      - name: Add Android permissions
        run: node scripts/prepare-android.mjs
        working-directory: desktop

      - name: Build Android APK
        run: npx tauri android build
        working-directory: desktop

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

  ios:
    name: iOS IPA (debug, no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: web

      # desktop 是独立包（非 pnpm workspace 成员），用 npm install 避免workspace 干扰
      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Prepare mobile config (set CORPS_WEB_URL)
        run: node scripts/prepare-mobile.mjs
        working-directory: desktop

      - name: Initialize Tauri iOS project
        run: npx tauri ios init
        working-directory: desktop

      - name: Build iOS (unsigned, xcodebuild direct)
        shell: bash
        run: |
          # 用 xcodebuild 直接构建，绕过 Tauri 的签名要求
          # CODE_SIGNING_ALLOWED=NO 产出未签名 .app，可后续用 Sideloadly 签名
          xcodebuild build \
            -project src-tauri/gen/apple/corps-desktop.xcodeproj \
            -scheme corps-desktop_iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath src-tauri/gen/apple/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: desktop
        continue-on-error: true

      # 从 DerivedData 提取 .app 打包为未签名 IPA
      # 用户下载后用 Sideloadly + 免费 Apple ID 本地签名
      - name: Package unsigned IPA
        shell: bash
        run: |
          app_name=$(find src-tauri/gen/apple/DerivedData -name "*.app" -maxdepth 5 | head -1)
          if [ -n "$app_name" ]; then
            mkdir -p Payload
            cp -r "$app_name" Payload/
            zip -r corps-desktop-unsigned.ipa Payload
            echo "Created unsigned IPA: $(ls -la corps-desktop-unsigned.ipa)"
          else
            echo "No .app found in DerivedData"
          fi
        working-directory: desktop

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            desktop/corps-desktop-unsigned.ipa
            desktop/src-tauri/gen/apple/build/Debug-iphoneos/**/*.app
            desktop/src-tauri/gen/apple/build/Debug-iphonesimulator/**/*.app
          retention-days: 30
          if-no-files-found: ignore

  harmonyos-prepare:
    name: HarmonyOS (structure validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate HarmonyOS project structure
        shell: bash
        run: |
          echo "Checking HarmonyOS WebView project structure..."
          base="desktop/harmonyos"
          required=(
            "$base/build-profile.json5"
            "$base/oh-package.json5"
            "$base/entry/oh-package.json5"
            "$base/entry/src/main/module.json5"
            "$base/entry/src/main/ets/entryability/EntryAbility.ets"
            "$base/entry/src/main/ets/pages/Index.ets"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              missing=1
            else
              echo "Found: $f"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "HarmonyOS project structure incomplete"
            exit 1
          fi
          echo "All required HarmonyOS files present"
