# =============================================================================
# 定时 smoke 监控：探测生产/staging 的 /api/health
#
# 启用方式：仓库 Settings → Secrets and variables → Actions → Variables
# 新增变量 SMOKE_TARGET_URL（如 https://corps.example.com），或执行：
#   gh variable set SMOKE_TARGET_URL --body https://你的域名
#
# 设计（2026-10-07 改，修"假绿"）：
#   job 1 `config-check`：每日一次，未配置 SMOKE_TARGET_URL 则**失败**。
#     为什么单独拆出来：探测 job 是 */15 高频跑的，若让它在未配置时失败，
#     会每 15 分钟发一封告警邮件，把真正的故障告警淹没；而"未配置"是
#     一次性配置缺陷，每日提醒一次足够。
#   job 2 `smoke-test`：每 15 分钟探测。未配置时**跳过探测**（输出 warning，
#     job 成功）——它不承担"提醒配置缺失"的职责，那个由 job 1 负责。
#
# 历史教训（2026-10-04 与 10-07 两次迭代）：
#   - 最初：未配置时 job 级 if 跳过 → 显示 skipped，与"健康"难以区分。
#   - 10-04：改为 warning + 跳过探测 → job 仍是 success，**列表页依然绿**，
#     "以为有监控、实际没有"的问题并未真正解决。
#   - 10-07：拆出 config-check 做硬失败，让"未配置"在 CI 列表页真实可见。
# =============================================================================
name: Smoke

on:
  schedule:
    # 每 15 分钟探测一次
    - cron: "*/15 * * * *"
    # 每日 01:00 UTC（= 09:00 北京时间）检查监控配置
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  # 每日一次的配置检查：未配置监控目标 → 失败，让缺失在列表页可见
  config-check:
    name: 监控配置检查
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 检查 SMOKE_TARGET_URL 是否已配置
        shell: bash
        run: |
          if [ -z "${{ vars.SMOKE_TARGET_URL }}" ]; then
            echo "::error::SMOKE_TARGET_URL 未配置——当前没有任何健康监控，等于生产裸奔。"
            echo "启用方式：gh variable set SMOKE_TARGET_URL --body https://你的域名"
            exit 1
          fi
          echo "SMOKE_TARGET_URL 已配置：${{ vars.SMOKE_TARGET_URL }}"

  # 高频探测：未配置时跳过（配置缺失由上面的 config-check 负责提醒）
  smoke-test:
    name: Smoke test (/api/health)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health and validate payload
        shell: bash
        env:
          TARGET: ${{ vars.SMOKE_TARGET_URL }}
        run: |
          # 未配置时跳过探测（配置缺失由每日的 config-check job 负责硬失败提醒）。
          # 这里用 step 内判断而非 `if:` 条件，避免依赖 `if` 对 vars 上下文的支持。
          if [ -z "$TARGET" ]; then
            echo "::warning::SMOKE_TARGET_URL 未配置，本次不探测。"
            echo "注意：本 job 不承担配置提醒职责——每日「监控配置检查」job 会因此失败。"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$TARGET/api/health")
          echo "HTTP $HTTP_CODE from $TARGET/api/health"
          cat /tmp/health.json || true

          # 校验 1：HTTP 状态码必须为 200
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::smoke 失败：/api/health 返回 HTTP $HTTP_CODE（期望 200）"
            exit 1
          fi

          # 校验 2：响应 JSON data.status == "ok" && data.db == "up"
          STATUS=$(jq -r '.data.status // empty' /tmp/health.json)
          DB=$(jq -r '.data.db // empty' /tmp/health.json)
          if [ "$STATUS" != "ok" ] || [ "$DB" != "up" ]; then
            echo "::error::smoke 失败：data.status=$STATUS data.db=$DB（期望 status=ok 且 db=up，说明 DB 探测未通过或应用降级）"
            exit 1
          fi
          echo "smoke 通过：应用存活且数据库可达"

      - name: 失败时的排查与配置指引
        if: failure()
        shell: bash
        run: |
          echo "::error::Smoke 告警处置指引 ——"
          echo "1) 查看告警：GitHub Actions 默认会向 watch 本仓库的用户及"
          echo "   触发该工作流的提交者发送失败邮件通知（Settings → Notifications）；"
          echo "   本页可查看完整日志判断是 HTTP 非 200 还是 db=down。"
          echo "2) 启用/修改监控目标：Settings → Secrets and variables → Actions"
          echo "   → Variables → 新增/更新 SMOKE_TARGET_URL（生产或 staging 的根地址）。"
          echo "3) 处置流程见 docs/runbook-monitoring.md §5：先 curl /api/health"
          echo "   区分 db down 与 app down，再按 runbook-deploy.md §4 回滚 DB 或重启应用。"
