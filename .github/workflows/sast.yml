name: SAST

# 静态应用安全测试（SAST）自动化。此前安全维度的自动化缺口：
# RLS/权限/契约等自有门禁之外，没有任何第三方静态分析在扫真实代码 ——
# 安全满分靠人工审计撑着（BATCH1 §6 的建议项，2026-10-26 落地）。
#
# 为什么只有 CodeQL 没有 gitleaks：
#   gitleaks（密钥泄漏扫描）需要先在本地跑通零命中再上线 —— 本机到
#   Docker Hub / 二进制下载的网络不可靠，无法预验证就直接上线，一旦历史
#   commit 有命中就会出现一道长期红。待网络窗口预验证后另批接入。
#
# 为什么不是 required check：CodeQL 的产出是 Security tab 的告警
# （新告警不阻断 PR），分析 job 失败才红；且分支保护的必过清单是固定
# 12 项，新增 workflow 天然不在其中。这是刻意的：先把扫描跑起来看噪音，
# 噪音可控后再议是否升级为门禁。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周二 04:31 UTC（北京 12:31），与 burndown 的错峰思路一致
    - cron: "31 4 * * 2"
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      # 告警写入 Security tab 需要 write
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # 扫描面 = web/（唯一 TS 代码树；desktop 是 Tauri 壳，代码量小，
          # 后续可加 languages: rust 另开 job）
          # queries 暂用默认套件；security-extended 噪音大，跑两周看基线再议
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
