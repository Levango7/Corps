name: CI

on:
  push:
    branches: [main]
    # v* tag 触发发版流水线：docker-publish 的 semver 规则（v0.2.0 → :0.2.0/:0.2）
    # 依赖 tag push 事件；此前缺此声明，打 tag 后 CI 静默不跑、镜像无版本 tag
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # 不写 version：CI 的 pnpm 版本改为读 web/package.json 的 packageManager，
          # 与 web/Dockerfile 的 `corepack enable pnpm` 同一来源。此前 `version: 11`
          # 是浮动解析——上游 11.28.3 一收紧 allowBuilds 就把 Build/E2E 打红（2026-10-01 实测）。
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      # --max-warnings 0：把 warning 也变成硬失败。
      # 此前只判 error，于是「新增一条 warning」是完全静默的——门禁只防变坏，
      # 不防"慢慢烂掉"。实测教训：本项目曾长期停在 40 条 warning（其中 34 条是
      # react-hooks/exhaustive-deps）却无人动手，因为 CI 一直是绿的。
      # 现在基线已清零（0 error / 0 warning，2026-10-07 实测），这条闸门可以关死。
      # 新增 warning 的正确修法是真修（useCallback 稳定引用等），
      # 确需豁免必须写 `eslint-disable ... -- 理由`，禁止裸 disable。
      - run: npx eslint . --max-warnings 0
      - run: npx prettier --check .
      # 显式类型检查（next build 也含 tsc，但 lint job 更早失败反馈更快）
      - run: node node_modules/typescript/bin/tsc --noEmit
      # 部署配置门禁（2026-10-04 补）：compose 用 ${VAR:?} 声明必填变量，
      # 若 .env.example 漏了对应条目，CI 全绿但新人按文档 `docker compose up -d` 会直接失败
      # ——即"文档化部署路径断裂而门禁沉默"。这两步把该缺口堵上。
      - run: python ../scripts/check_compose_env_sync.py
      # 对模板自身跑一遍前置检查：同时验证 URL 端口与 APP_PORT 自洽（不一致会让
      # 邀请链接/邮件/支付回调静默指向错误地址）
      - run: python ../scripts/preflight.py ../.env.example
      # design-tokens.css 同步门禁：web/app/ 下是构建用副本（Dockerfile 的上下文是
      # ./web，拿不到仓库根 design/，只能复用入库副本），两份文件会静默漂移。
      # 实测曾漂移 521 行、且源文件被 autocrlf 转成 CRLF 导致 next build 报
      # "CssSyntaxError: Missed semicolon"。此处钉死"逐字节一致 + 均为 LF"。
      - run: python ../scripts/check_design_tokens_sync.py
      # v1 守卫残留棘轮（2026-10-09 补）：authFailure 收口是分批推进的
      # （tasks 域 27 处 -> +documents/approvals/databases/conversations 88 处），
      # 全仓仍有 269 处在用 getWorkspaceContext(v1)。此前这个数字只活在一次性的
      # Python 脚本里，**没人看得见、也没人守得住**——下一批随时可能半途而废，
      # 新代码也可能照着旧写法继续产出 v1（2026-10-08 实测：编码规范的示范代码
      # 当时仍在推荐 v1，等于一个持续制造残留的源头，已在同一轮修掉）。
      # 此门禁让残留只减不增：新增 v1 调用判 NEW_V1，已收口却忘记删基线行判
      # STALE_V1（不强制删行，数字就永远收紧不了）。
      - run: python ../scripts/check_v1_guard_ratchet.py
      - run: python ../scripts/check_v1_guard_ratchet.py --self-test
      # ADR-015 登记表门禁（2026-10-09 补）：web/components/files/** 与
      # web/components/im/FilePreview.tsx 共 20 个文件**静态零引用**（`grep -rn "previews/"` 零命中），
      # 是「后端 API 已上线、前端没挂载」的半成品，不是死代码——砍掉等于砍掉一个
      # 已完成功能的前半截。ADR-015 §5 用文档写了"不得以清理死代码为由删除"，
      # 但**文档拦不住下一个动手的人**：这个约束原本只活在人的记忆里。
      # 此门禁把它变成机器判据：文件消失 / 范围内冒出表外新文件 / 表自身条目重复，
      # 三种红因各自独立。解除约束的正规路径只有一条——改 ADR-015 状态 + 同提交更新此表。
      # 放在 lint job 而非新开 job：lint 已是 required status check，
      # 新 job 不在必需清单里，变红也拦不住合并。
      - run: python ../scripts/check_adr015_manifest.py
      - run: python ../scripts/check_adr015_manifest.py --self-test
      # P0 内容规约门禁（2026-10-12 补）：5 条 P0 绝对规则（禁 emoji/dingbat 作功能图标、
      # 禁紫→粉渐变、禁 AI 模板文案、禁硬编码色、禁弹跳缓动）此前全靠人眼评审，已漏过多次。
      # 最近一次全量审计清出 6 条 blocking 违反，其中两条藏在 design/design-tokens.css 里、
      # 消费方是死类 —— 人眼评审看不见，因为「名义 clean 的 token 源文件里藏着被禁内容」
      # 正是本项目踩过的坑（cubic-bezier(0.68,-0.55,0.265,1.55) 就写在 token 源里，
      # 随 next build 进产物 CSS）。e2e/ui-style.spec.ts 也只扫四个页面，定价页曾用
      # 9 个 ✅ 当功能图标而 CI 全程绿灯。
      # 棘轮语义：基线外首见的 (文件,规则) 判 NEW_*，已登记文件的处数变多判 REGRESSION_*，
      # 只减不增。放在 lint job 而非新开 job：lint 已是 required status check，
      # 新 job 不在必需清单里，变红也拦不住合并。
      - run: python ../scripts/check_p0_content.py
      # 自测断言是「红因集合相等」（注入已知违反，扫出的原因集合必须精确等于预期，
      # 多一条少一条都算失败），防止检测器本身退化成「永远 PASS」的假门禁。
      - run: python ../scripts/check_p0_content.py --self-test
      # §6 活态认领表判据：表在**一条独立分支**上（refs/heads/coordination-claims，
      # 见 docs/COORDINATION.md §6.2），由脚本自己 fetch —— 所以判的是「当前谁在占什么」，
      # 而不是某次提交的快照。表搬出仓库文件就是为了这一点（仓库文件要等 PR 合并才进 main，
      # 认领对别人几乎不可见）。
      # 判据两条：格式合法 + 无「同一资源被两条未过期认领占用」。
      # 已过期的行**只提示不判红**：§6.4 承诺「忘了也没关系，expires 会兜底」，
      # 过期判红等于自己打自己，而且一个忘记 release 的人就能卡死全仓的 PR。
      # 放在 lint job 而非新开 job：lint 已是 required status check，新 job 不在必需清单里，
      # 变红也拦不住合并（同 check_adr015_manifest / check_p0_content 的理由）。
      # 它**抓不到**「压根没认领就动手」——那正是 2026-10-15 事故的形态，只能靠 §6.3 的
      # 自觉执行；脚本的 preflight 把 §6.3 压成一条命令，就是为了降低那道门槛。
      - run: python ../scripts/check_coordination_claims.py
      # 门禁自己也要被门禁：五类注入变异各自因正确的红因变红（取不到表 / 三类格式非法 / 冲突），
      # 外加一条**必须不判红**的负例（「已过期 + 活跃同资源」不许判成冲突），
      # 以及十五条纯函数断言 —— 其中「自己认领 + 工作树是脏的 ⇒ 放行」是实测踩出来的自锁，
      # 不钉住就会随下次重构原样复发。
      - run: python ../scripts/check_coordination_claims.py --self-test
      # Dockerfile 基础镜像门禁（2026-10-22 补）：v0.8.0 与 v0.8.1 两个版本都没有容器镜像，
      # 根因是 web/Dockerfile 三个 FROM 写死第三方镜像源 docker.m.daocloud.io（理由是本机
      # Docker Hub 不可达）。该源在 2026-10-20 21:41 UTC 后失效，GitHub 托管 runner 上直接
      # NXDOMAIN：
      #     dial tcp: lookup docker.m.daocloud.io on 168.63.129.16:53: no such host
      # 代价不是"某版本没发出来"，而是 main 上**每一次** push 的 Publish image (GHCR) 全红，
      # :latest 断了一整天。能潜伏这么久的原因是 PR 阶段压根没有任何一步碰 Dockerfile：
      # docker-publish 的 if 是 `push && (main || tags/v*)`，PR 下必然 skipped；Build job 跑的
      # 是 pnpm run build（Next.js 构建），不是 docker build。于是"Dockerfile 改坏了"在 PR 上
      # **完全不可见**，只会在合并之后炸。
      # 判据四条：FROM 全解析（不许留未定义变量）/ tag 必须明确且非 latest /
      # 同仓库镜像跨阶段不许 tag 漂移（deps 用 node:20 编译、runner 用 node:22 运行的
      # 原生模块错配就栽在这里）/ 每个镜像都要能从其 registry 取到 manifest。
      # 探测器直接打 registry v2 API（含 Bearer token 流），**不依赖 docker 守护进程**——
      # 门禁自己不能再引入"本地没起 Docker 就跑不了"的新脆弱点。
      # 429/5xx 只警告不判红：基础设施抖动不该卡死所有 PR；DNS 失败/404/未定义变量一律判红。
      - run: python ../scripts/check_dockerfile_base_images.py
      # 注入式自测：未定义变量 / 缺 tag / latest / 跨阶段漂移 / 无 FROM / 镜像不可达 /
      # tag 不存在 / registry 临时故障，八类红因各自独立，外加"warn 与阻断级的边界"断言。
      # 没有这一条，上面的检测器退化成一个永远 PASS 的假门禁也没人知道。
      - run: python ../scripts/check_dockerfile_base_images.py --self-test

  # 覆盖率棘轮：只跑单测、不连数据库，因此集成腿/加固腿再怎么红也一定会产出覆盖率数字。
  # 存在的理由（两条都是实测踩过的）：
  #   1) Test job 里 `vitest run --coverage` 排在 `bash db/rls-smoke.sh` 之后，
  #      smoke 一炸整个 job 终止 → 覆盖率步骤在 CI 连红期间一次都没执行过；
  #   2) Vitest 的 coverage.reportOnFailure 默认 false → 任一测试变红时覆盖率根本不评估。
  # 阈值来自 2026-09-29 本地实测（unit-only）：lines 3.98% / statements 3.98% /
  # functions 58.91% / branches 73.71%。这是**棘轮下界，只允许上调**；
  # 为了变绿而下调阈值等于削测试强度，需要单独说明理由并经用户确认。
  # Test job 的 20/15/20/20 阈值（unit+integration 合并腿）保持不动。
  coverage:
    name: Unit Coverage Ratchet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      # 阈值一律**不放宽**：下面只新增判据，不动这四档。
      - run: >
          npx vitest run tests/unit --coverage
          --coverage.thresholds.lines=3.5
          --coverage.thresholds.statements=3.5
          --coverage.thresholds.functions=55
          --coverage.thresholds.branches=70
      # 零行覆盖文件棘轮：上面 functions/branches 两档其实**可以被"什么都不做"满足**——
      # 2026-10-01 实测 707 个被统计文件里 646 个（91.4%）行覆盖为 0，它们仍各自往
      # functions/branches 计数器贡献条目，把全库 functions 抬到 58.73%，
      # 而只看那 61 个真有行被跑到的文件实为 46.86%（164/350）。
      # 改成清单口径：一个源文件要么被测到，要么在 scripts/zero-coverage-baseline.txt 占一行。
      # 必须排在 vitest 之后（读它产出的 coverage-summary.json）。
      - name: Zero-coverage file ratchet (shrink-only)
        run: python ../scripts/check_zero_coverage_ratchet.py
      # 门禁自己也要被门禁：六类注入变异必须各自"因正确的红因"变红，
      # 否则判据坏掉时它会永远绿灯（这道门禁的初版自检就曾被 fixture 自己骗过）。
      - name: Mutation-check the zero-coverage ratchet itself
        run: python ../scripts/check_zero_coverage_ratchet.py --self-test

  # RLS 覆盖率防回归：对 schema.prisma 中每个含 workspaceId 的租户表，核验
  # rls-activate.sql 是否给齐 ENABLE + FORCE + 至少一条 CREATE POLICY 三态。
  # 同时做表级 schema↔迁移漂移检查（无库可连的静态回退模式）。
  # 轻量 job（仅需 checkout + Python），与其他 job 并行运行。
  rls-coverage:
    name: RLS Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check RLS coverage (schema vs rls-activate.sql)
        run: python scripts/check_rls_coverage.py
      # 豁免登记表：上面那份只管"带 workspaceId 的表三态齐不齐"，默认无租户键的表不讨论，
      # 于是"新增一张既无租户键又无租户父级的表"两份门禁都不会响。此脚本把未覆盖集合冻成
      # 只允许收缩的基线（20 张，分类见 ADR-010），新表未登记即红。
      - name: Check RLS exemption registry (shrink-only baseline)
        run: python scripts/check_rls_exemptions.py
      # 门禁自己也要被门禁：五类注入变异必须各自"因正确的原因"变红。
      # 踩过一次——fixture 把 @@map 误写成 @map，四条变异全因同一原因红，看着全绿实则没测。
      - name: Mutation-check the exemption gate itself
        run: python scripts/check_rls_exemptions.py --self-test
      - name: Check schema ↔ migration drift (table level, static)
        run: python scripts/check_schema_migration_drift.py

  # Prisma schema ↔ 已部署库 漂移门禁（权威模式，直连 information_schema）。
  # 独立 job：需要 postgres 服务跑 migrate deploy，故不与轻量 rls-coverage 合并。
  # 存在的理由：ai_conversations / ai_messages / push_tokens 三张表只写在 schema.prisma、
  # 从未进迁移链，靠 db push 活在开发库里，令加固模式 CI 与容器启动双双中断约三周无人发现。
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_drift
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy migrations into a clean database
        working-directory: web
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_drift
      # 列级检查只在权威模式下做：库里的真空驼峰列（messages."isRecalled" 等）
      # 靠文本解析极易误判，宁可连库看事实。
      - name: Assert schema.prisma objects all exist in deployed db
        run: python scripts/check_schema_migration_drift.py --database-url "postgresql://postgres:test@localhost:5432/corps_drift"

  # API 契约防漂移：扫描 web/app/api/**/route.ts 得到实际路由，与
  # api/openapi.yaml 的 path 声明的差集不得超过 scripts/api-contract-baseline.txt。
  # 基线只允许收缩：新增路由必须同步契约，或显式追加到基线。
  # 轻量 job（仅需 checkout + Python），与其他 job 并行运行。
  api-contract:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check API contract drift
        run: python scripts/check_api_contract.py

  # 角色权限矩阵落地缺口防回归：判定口径是 handler 级（同文件内 DELETE 有门禁、
  # PATCH 没有的情形真实存在，按文件统计会误判为已覆盖）。
  # 扫描根为整个 web/app/api/**，分五档各持一份只允许收缩的基线：
  #   T1 permission-gate-baseline.txt              矩阵域内、完全无角色判断（真缺口）
  #   T2 permission-gate-adhoc-baseline.txt        矩阵域内、仅 ad-hoc 角色比较（需复核）
  #   T3 permission-gate-unscoped-baseline.txt     矩阵外资源域、完全无角色判断（未评估）
  #   T4 permission-gate-unscoped-adhoc-baseline.txt 矩阵外资源域、有 ad-hoc 判断
  #   T5 permission-gate-modules-unwired-baseline.txt  矩阵声明了但生产零调用的模块
  # 另有硬失败：代码调用矩阵中不存在的模块名（除 owner 外一律 403），不配基线、必须清零。
  # 矩阵模块清单从 web/lib/permissions.ts 的 MODULES 读取，脚本不复制一份（避免两处声明）。
  # 五份基线必须与脚本同批提交，缺任一文件该 job 直接 FAIL（防"基线缺失=静默放行"）。
  # 轻量 job（仅需 checkout + Python），与其他 job 并行运行。
  permission-gate:
    name: Permission Gate Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check role-permission enforcement coverage (5 tiers, shrink-only)
        run: python scripts/check_permission_gates.py
      # 上面那份只统计"handler 源码里有没有角色判断"，看不见 2026-10-03 引入的
      # 统一写策略 choke point：handler 只要不经过 getWorkspaceContext，就完全不在墙内，
      # 而五档门禁会给它记一个"本来也没有角色判断"，等于默认放行。本脚本补这条线：
      # 每个写 handler 必须二选一——进墙（调用 getWorkspaceContext），或登记并写明理由。
      - name: Check write-access registry (covered-or-registered)
        run: python scripts/check_write_access_registry.py
      # 门禁自己也要被门禁：三类注入变异必须各自因正确的红因变红
      - name: Mutation-check the write-access registry itself
        run: python scripts/check_write_access_registry.py --self-test

  # 安全审计：high/critical 级别漏洞必须阻止 CI；moderate/low 仅报告不阻断
  # 独立 job 并行运行，与 test job 互不阻塞，缩短 CI 总时长
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 仅审计生产依赖；--audit-level=high 表示 high/critical 漏洞会让命令退出非 0
      # moderate/low 漏洞会打印但不影响退出码，避免过度阻塞迭代
      - name: Audit production deps (high/critical block CI)
        run: pnpm audit --prod --audit-level=high
      # audit 失败时打印完整 advisory 列表（定位阻断漏洞名）
      - name: Audit details on failure
        if: failure()
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > audit-failed.json
          node -e "const j=require('./audit-failed.json'); const a=j.advisories||{}; for (const k of Object.keys(a)) { const v=a[k]; console.log(String(v.severity).toUpperCase(), v.module_name, String(v.title).slice(0,140), v.url) }"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      # 应用 Prisma 迁移（生产方式，验证 migrations 目录完整性）
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      # ── RLS 引擎级冒烟（AC-04 引擎断言）：以 NOBYPASSRLS 角色直连验证租户隔离 ──
      # 集成测试走 postgres 超级用户（绕过 RLS），此处补上数据库层的真实强制证明
      - name: RLS engine-level smoke (db/rls-smoke.sh)
        working-directory: .
        shell: bash
        run: bash db/rls-smoke.sh
        env:
          DATABASE_OWNER_URL: postgresql://postgres:test@localhost:5432/corps_test
          APP_DATABASE_URL: postgresql://corps_app:rls-ci-app-password@localhost:5432/corps_test
          CORPS_APP_PASSWORD: rls-ci-app-password
      - name: Start app for integration tests
        working-directory: web
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "dev server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret-32chars-min
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-min
          BETTER_AUTH_SECRET: ci-test-better-auth-secret-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # 集成测试同源高频请求会被限流拦截，测试环境关闭限流
          RATE_LIMIT_DISABLED: "1"
      - run: npx vitest run --coverage
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret-32chars-min
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-min
          BETTER_AUTH_SECRET: ci-test-better-auth-secret-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # 单元/集成测试中触发限流会造成假失败，测试环境关闭限流
          RATE_LIMIT_DISABLED: "1"
      - name: Stop dev server
        working-directory: web
        shell: bash
        if: always()
        run: |
          if [ -f next-dev.pid ]; then
            kill "$(cat next-dev.pid)" 2>/dev/null || true
            rm -f next-dev.pid
          fi

  # 加固模式端到端回归：应用以 corps_app（NOBYPASSRLS 最小权限角色）连接、
  # 数据库启用 FORCE RLS——与生产 docker-compose 的 RLS_ACTIVATE=true 同构。
  # 普通集成测试以 postgres 超级用户运行（超级用户绕过 RLS），无法发现
  # "裸 prisma 查询在加固模式下静默返空" 的缺陷（审计 P1-1 的系统性根因）。
  test-hardened:
    name: Test (hardened RLS mode)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      # 幂等应用 RLS 加固（角色/FORCE/策略），与容器 entrypoint 的生产行为一致；
      # runner 自带 psql（与上方 rls-smoke 步骤同一前提）
      - name: Activate RLS (db/rls-activate.sql)
        working-directory: .
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -q \
            "postgresql://postgres:test@localhost:5432/corps_test" \
            -v app_password=hardened-ci-app-password \
            -f db/rls-activate.sql
      - name: Start app as corps_app (hardened)
        working-directory: web
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "hardened dev server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
        env:
          # 应用以最小权限角色连接（生产同构），RLS 策略真实生效
          DATABASE_URL: postgresql://corps_app:hardened-ci-app-password@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret-32chars-min
          BETTER_AUTH_SECRET: ci-test-better-auth-secret-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RATE_LIMIT_DISABLED: "1"
      # 引擎级 RLS 断言（rls-engine.test.ts，corps_app 直连）此前恒被 describe.skip——
      # .github 里从未注入过 RLS_SMOKE_*。这里注入两条连接串，并用守卫逐条核对
      # assertionResults：vitest 的 JSON 报告会把"四条全跳过"的 suite 也标成 passed，
      # 只看文件在不在或只看 suite 状态都是假绿。守卫自身两向验过（注入→绿、缺失→判红）。
      - name: Run integration tests (含引擎级 RLS 断言，禁止静默 skip)
        shell: bash
        run: |
          set -euo pipefail
          : "${RLS_SMOKE_OWNER_URL:?未注入：rls-engine.test.ts 会退成 describe.skip}"
          : "${RLS_SMOKE_APP_URL:?未注入：rls-engine.test.ts 会退成 describe.skip}"
          npx vitest run tests/integration \
            --reporter=default --reporter=json --outputFile.json=vitest-integration.json
          node scripts/assert-rls-engine-ran.mjs vitest-integration.json
        env:
          TEST_BASE_URL: http://localhost:3000/api/v1
          RATE_LIMIT_DISABLED: "1"
          # 表主：幂等写双租户夹具；corps_app（NOBYPASSRLS）：断言引擎层隔离真实生效
          RLS_SMOKE_OWNER_URL: postgresql://postgres:test@localhost:5432/corps_test
          RLS_SMOKE_APP_URL: postgresql://corps_app:hardened-ci-app-password@localhost:5432/corps_test
      - name: Stop dev server
        working-directory: web
        shell: bash
        if: always()
        run: |
          if [ -f next-dev.pid ]; then
            kill "$(cat next-dev.pid)" 2>/dev/null || true
            rm -f next-dev.pid
          fi

  # E2E 生产构建验证：集成测试此前只在 next dev（dev server）上运行过，
  # 本 job 用 npx next build + next start 对生产构建产物做端到端验证，
  # 弥补"dev server 通过 ≠ 生产构建可用"的缺口（如 standalone/turbopack 差异、
  # 生产模式下的环境变量与路由行为）。
  e2e:
    name: E2E (production build)
    needs: [lint, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      # 生产方式应用迁移，与 test job 一致
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      - name: Build production bundle
        run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: "ci-test-access-secret-32chars-min"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-32chars-min"
          BETTER_AUTH_SECRET: "ci-test-better-auth-secret-32chars"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Start production server and wait for readiness
        shell: bash
        run: |
          nohup npx next start -p 3000 > next-start.log 2>&1 &
          echo $! > next.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "production server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-start.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: "ci-test-access-secret-32chars-min"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-32chars-min"
          BETTER_AUTH_SECRET: "ci-test-better-auth-secret-32chars"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RATE_LIMIT_DISABLED: "1"
      - name: Run integration tests against production build
        run: npx vitest run tests/integration
        env:
          TEST_BASE_URL: http://localhost:3000/api/v1
          RATE_LIMIT_DISABLED: "1"
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: "ci-test-access-secret-32chars-min"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-32chars-min"
          BETTER_AUTH_SECRET: "ci-test-better-auth-secret-32chars"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      # 浏览器级真 E2E：playwright.config.ts 的 testDir:"./e2e" 未限定 testMatch，
      # 故运行 e2e/ 下全部用例（非仅 smoke）。打的是上面已就绪的生产构建 server，
      # 补齐"真实浏览器水合与交互"盲区
      # --update-snapshots=missing：视觉回归基线（ui-visual.spec.ts）首跑记录、
      # 后续比对。基线从下方产物下载提交入库后才真正生效；CI 环境跨次运行
      # 渲染确定（同镜像同 chromium），本地因系统字体栈差异不可比（spec 已 test.skip 本地）。
      - name: Run browser E2E tests
        run: npx playwright test --config playwright.config.ts --update-snapshots=missing
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          RATE_LIMIT_DISABLED: "1"
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f next.pid ]; then
            kill "$(cat next.pid)" 2>/dev/null || true
            rm -f next.pid
          fi
      # 视觉回归基线产物：首跑以 missing 模式记录的基线在此下载，
      # 提交入库后纳入后续所有 PR 的像素比对。
      - name: Upload visual baselines
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots
          path: web/e2e/*-snapshots/
          if-no-files-found: ignore
      # E2E 失败时上传 Playwright 产物（trace/screenshot/HTML 报告/JSON 报告），
      # 便于离线定位浏览器级失败。playwright.config.ts: trace=retain-on-failure，
      # outputDir 默认 test-results/，HTML 报告默认 playwright-report/，JSON 报告 pw-report.json。
      # working-directory=web，故产物在 web/ 下；if: failure() 确保仅失败时上传，节省存储。
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
            web/pw-report.json
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build
    needs: [lint, test, audit, schema-drift]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts：pnpm 11 默认拦截依赖构建脚本并使 install 退出非零
      # （ERR_PNPM_IGNORED_BUILDS：@parcel/watcher、@swc/core 等），与 web/Dockerfile 同方案
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      - run: pnpm run build

  # ─── 产物化：构建并发布 Docker 镜像到 GitHub Container Registry（GHCR）───
  # 取代原 CloudBase 占位部署（此前刻意 exit 1 防假绿）。镜像即部署产物：
  # 生产服务器 docker pull 后按 docs/runbook-deploy.md 的 compose 编排启动。
  # 首次发布后如需公开拉取，在 GitHub → Packages → corps-web 中调整可见性。
  docker-publish:
    name: Publish image (GHCR)
    needs: [lint, test, test-hardened, build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            # :latest tag 仅在 push 到 main 时产出（来源：CI/CD 发布门经验——
            # docker/metadata-action 默认不产 latest，需显式 type=raw 声明）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
