name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx eslint .
      - run: npx prettier --check .

  # 安全审计：high/critical 级别漏洞必须阻止 CI；moderate/low 仅报告不阻断
  # 独立 job 并行运行，与 test job 互不阻塞，缩短 CI 总时长
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 仅审计生产依赖；--audit-level=high 表示 high/critical 漏洞会让命令退出非 0
      # moderate/low 漏洞会打印但不影响退出码，避免过度阻塞迭代
      - name: Audit production deps (high/critical block CI)
        run: pnpm audit --prod --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      # 应用 Prisma 迁移（生产方式，验证 migrations 目录完整性）
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      # ── RLS 引擎级冒烟（AC-04 引擎断言）：以 NOBYPASSRLS 角色直连验证租户隔离 ──
      # 集成测试走 postgres 超级用户（绕过 RLS），此处补上数据库层的真实强制证明
      - name: RLS engine-level smoke (db/rls-smoke.sh)
        working-directory: .
        shell: bash
        run: bash db/rls-smoke.sh
        env:
          DATABASE_OWNER_URL: postgresql://postgres:test@localhost:5432/corps_test
          APP_DATABASE_URL: postgresql://corps_app:rls-ci-app-password@localhost:5432/corps_test
          CORPS_APP_PASSWORD: rls-ci-app-password
      - name: Start app for integration tests
        working-directory: web
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "dev server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # 集成测试同源高频请求会被限流拦截，测试环境关闭限流
          RATE_LIMIT_DISABLED: "1"
      - run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # 单元/集成测试中触发限流会造成假失败，测试环境关闭限流
          RATE_LIMIT_DISABLED: "1"
      - name: Stop dev server
        working-directory: web
        shell: bash
        if: always()
        run: |
          if [ -f next-dev.pid ]; then
            kill "$(cat next-dev.pid)" 2>/dev/null || true
            rm -f next-dev.pid
          fi

  # E2E 生产构建验证：集成测试此前只在 next dev（dev server）上运行过，
  # 本 job 用 npx next build + next start 对生产构建产物做端到端验证，
  # 弥补"dev server 通过 ≠ 生产构建可用"的缺口（如 standalone/turbopack 差异、
  # 生产模式下的环境变量与路由行为）。
  e2e:
    name: E2E (production build)
    needs: [lint, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      # 生产方式应用迁移，与 test job 一致
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      - name: Build production bundle
        run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Start production server and wait for readiness
        shell: bash
        run: |
          nohup npx next start -p 3000 > next-start.log 2>&1 &
          echo $! > next.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "production server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-start.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # 集成测试同源高频请求会被限流拦截，测试环境关闭限流
          RATE_LIMIT_DISABLED: "1"
      - name: Run integration tests against production build
        run: npx vitest run tests/integration
        env:
          TEST_BASE_URL: http://localhost:3000/api/v1
          RATE_LIMIT_DISABLED: "1"
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      # 浏览器级真 E2E 冒烟（e2e/smoke.spec.ts）：注册→工作区→新建任务，
      # 打的是上面已就绪的生产构建 server，补齐"真实浏览器水合与交互"盲区
      - name: Run browser E2E smoke
        run: npx playwright test --config playwright.config.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          RATE_LIMIT_DISABLED: "1"
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f next.pid ]; then
            kill "$(cat next.pid)" 2>/dev/null || true
            rm -f next.pid
          fi

  build:
    name: Build
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm run build

  deploy-staging:
    name: Deploy Staging
    needs: build
    # 未配置 CloudBase 环境变量时跳过，避免"假通过"的占位部署
    if: github.ref == 'refs/heads/main' && vars.CLOUDBASE_ENV_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Docker image
        working-directory: web
        run: docker build -t corps-web:${{ github.sha }} .
      - name: Deploy to CloudBase
        env:
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --secretId "$CLOUDBASE_SECRET_ID" --secretKey "$CLOUDBASE_SECRET_KEY"
          echo "Deploying corps-web:${{ github.sha }} to CloudBase env $CLOUDBASE_ENV_ID"
          # TODO: 根据实际 CloudBase 服务配置调整部署命令
          # 静默成功即"假绿"：部署命令缺失时必须显式失败，防止误判发布成功
          echo "ERROR: CloudBase 部署命令尚未配置——此 job 刻意失败以防止假绿。"
          echo "请按 docs/runbook-deploy.md 补齐部署命令后移除本退出码。"
          exit 1

  deploy-production:
    name: Deploy Production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.CLOUDBASE_ENV_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Docker image
        working-directory: web
        run: docker build -t corps-web:${{ github.sha }} .
      - name: Deploy to CloudBase
        env:
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --secretId "$CLOUDBASE_SECRET_ID" --secretKey "$CLOUDBASE_SECRET_KEY"
          echo "Deploying corps-web:${{ github.sha }} to CloudBase env $CLOUDBASE_ENV_ID"
          # TODO: 根据实际 CloudBase 服务配置调整部署命令
          # 静默成功即"假绿"：部署命令缺失时必须显式失败，防止误判发布成功
          echo "ERROR: CloudBase 部署命令尚未配置——此 job 刻意失败以防止假绿。"
          echo "请按 docs/runbook-deploy.md 补齐部署命令后移除本退出码。"
          exit 1
