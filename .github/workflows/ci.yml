name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx eslint .
      - run: npx prettier --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      # 应用 Prisma 迁移（生产方式，验证 migrations 目录完整性）
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      - name: Start app for integration tests
        working-directory: web
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "dev server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          BETTER_AUTH_SECRET: ci-test-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm run build

  deploy-staging:
    name: Deploy Staging
    needs: build
    # 未配置 CloudBase 环境变量时跳过，避免"假通过"的占位部署
    if: github.ref == 'refs/heads/main' && vars.CLOUDBASE_ENV_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Docker image
        working-directory: web
        run: docker build -t corps-web:${{ github.sha }} .
      - name: Deploy to CloudBase
        env:
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --secretId "$CLOUDBASE_SECRET_ID" --secretKey "$CLOUDBASE_SECRET_KEY"
          echo "Deploying corps-web:${{ github.sha }} to CloudBase env $CLOUDBASE_ENV_ID"
          # TODO: 根据实际 CloudBase 服务配置调整部署命令

  deploy-production:
    name: Deploy Production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.CLOUDBASE_ENV_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Docker image
        working-directory: web
        run: docker build -t corps-web:${{ github.sha }} .
      - name: Deploy to CloudBase
        env:
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --secretId "$CLOUDBASE_SECRET_ID" --secretKey "$CLOUDBASE_SECRET_KEY"
          echo "Deploying corps-web:${{ github.sha }} to CloudBase env $CLOUDBASE_ENV_ID"
          # TODO: 根据实际 CloudBase 服务配置调整部署命令
