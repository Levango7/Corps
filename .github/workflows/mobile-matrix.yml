name: Mobile Matrix (Cloud)

# ─── 云端移动端矩阵（2026-09-08）：无本地硬件条件的三平台云化 ───
#
# 平台策略（详见 docs/platform-verification.md §云矩阵）：
#  - iOS/Safari：macos-latest runner（公开仓库免费，预装 Xcode）跑真 WebKit
#    layout-audit——本仓库 Android/iOS 真机全靠云，webkit 档从"近似"升"真机"
#  - Android：ubuntu-latest + KVM + android-emulator-runner 官方 action，
#    模拟器内真实系统 Chrome 由 Playwright _android 驱动（等价 USB+inspect）
#  - HarmonyOS：无公共 CI 云（DevEco 模拟器需嵌套虚拟化，CI 不给），引擎层
#    ArkWeb=Chromium 已由现有 chromium 档覆盖，真机层走华为云远程真机（手动）
#
# 触发：手动 + 每周一 04:00 UTC（北京周一 12:00）——移动端回归是低频档，
# 不挂 push（避免每 commit +15 分钟 CI；主链路仍由 ci.yml 保障）

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  ios-safari:
    name: iOS Safari (macOS WebKit)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      # macOS runner 无 service container 支持，且原用的
      # ikalnytskyi/postgresql-action 已下架（首跑 Set up 失败根因）——
      # 改 Homebrew 直装 + brew services 起库（runner 预装 brew）。
      # 二轮坑：brew services 异步启动，createuser 跑在 socket 就绪前
      # （No such file or directory）→ 先轮询 pg_isready 再建用户，
      # 且去掉 || true 让真实错误尽早暴露
      - name: Install & start PostgreSQL (Homebrew)
        shell: bash
        run: |
          brew install postgresql@18
          brew services start postgresql@18
          # brew services 是异步的：先等 socket 真正可连
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@18/bin/pg_isready -h localhost -p 5432 && break
            sleep 2
          done
          /opt/homebrew/opt/postgresql@18/bin/pg_isready -h localhost -p 5432
          PG=/opt/homebrew/opt/postgresql@18/bin
          # brew PG 默认超级用户是 $USER（runner），无 postgres 角色与密码
          "$PG/createuser" -s postgres
          "$PG/psql" -U runner -d postgres -c "ALTER USER postgres PASSWORD 'test';"
          "$PG/createdb" -U runner -O postgres corps_test
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
      - name: Start dev server
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-mac-access-secret
          JWT_REFRESH_SECRET: ci-mac-refresh-secret
          BETTER_AUTH_SECRET: ci-mac-better-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RATE_LIMIT_DISABLED: "1"
      # macos runner 预装 Playwright 依赖基本齐，--with-deps 兜底系统库
      - run: npx playwright install webkit --with-deps
      # 只跑 webkit 档（AUDIT_ENGINES 过滤）：macOS 上这是真 Safari 引擎，
      # 不再是本地 Windows 的"近似"——本 job 存在的全部意义
      - name: Run layout-audit (webkit, real Safari engine)
        run: node scripts/layout-audit.mjs
        env:
          BASE_URL: http://localhost:3000
          AUDIT_ENGINES: webkit
      - name: Stop dev server
        if: always()
        shell: bash
        run: |
          [ -f next-dev.pid ] && kill "$(cat next-dev.pid)" 2>/dev/null || true

  android-chrome:
    name: Android Chrome (cloud emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
        # PG 用 service container（ubuntu 支持）
      # KVM 加速验证（无 KVM 时模拟器慢 10 倍且常超时，宁可早失败信息也清晰）
      - name: Enable KVM group perms
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Start dev server (host loopback for emulator 10.0.2.2)
        shell: bash
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          echo $! > next-dev.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health > /dev/null || { cat next-dev.log; exit 1; }
          # 预热注册路由：Turbopack 冷编译 register + better-auth 首次调用
          # 可能远超 30s（七轮实测 POST 30s 无响应的根因）——模拟器开跑前
          # 在宿主侧先打一次，让编译发生在等待窗口内
          curl -s -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"warmup-'$GITHUB_RUN_ID'@example.com","password":"Warmup123!","workspaceName":"warmup"}' \
            -o /dev/null -w "register warmup: %{http_code} in %{time_total}s\n" --max-time 180
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/corps_test
          JWT_ACCESS_SECRET: ci-and-access-secret
          JWT_REFRESH_SECRET: ci-and-refresh-secret
          BETTER_AUTH_SECRET: ci-and-better-auth-secret
          # 关键：模拟器从 10.0.2.2:3000 访问宿主——APP_URL 必须与实际访问源
          # 一致，否则注册/登录后 cookie 域不匹配、会话种不上（五轮实测：
          # 提交注册后跳回 signup 页的根因）
          NEXT_PUBLIC_APP_URL: http://10.0.2.2:3000
          RATE_LIMIT_DISABLED: "1"
      - name: Run Android emulator + Playwright device smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # Google APIs 镜像（非 AOSP）含系统 Chrome——真 Chrome 才是本档意义。
          # 注意：-prop 只支持 qemu.* 属性（emulator 明确警告），系统 locale
          # 强制不了——语言兜底在 smoke 脚本层做（双语 label 探测）
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # emulator-runner 的 script 逐行独立 /bin/sh -c 执行——上一行的
            # cd 不会延续到下一行（两轮实测）。所有命令 && 串成一行，每行
            # 自带绝对 cwd
            cd "$GITHUB_WORKSPACE/web" && npx playwright install chromium && node scripts/android-device-smoke.mjs
      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shots
          path: web/shots-android/
          retention-days: 7
      - name: Stop dev server
        if: always()
        shell: bash
        run: |
          [ -f next-dev.pid ] && kill "$(cat next-dev.pid)" 2>/dev/null || true

    # Android job 的 PG service container（放 job 级）
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: corps_test
        ports:
          - 5432:5432
