version: 2
updates:
  # web/ 前端依赖（pnpm-lock.yaml；ecosystem npm 兼容 pnpm）
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # 分组判据 = 「锁文件里谁的键会互相改写」：pnpm 的 lockfileVersion 9 把 peer 版本
      # 嵌进依赖键（`next@16.4.2(...)(@types/node@26.6.5)(...)`），所以同家族拆不开——
      # 一笔 bump 必然连带改写整片 peer 键。不共享 peer 键的绝不合到一批。
      #
      # 反面教材是 #257：单个 minor-and-patch 组把 26 个跨 5 个家族的依赖挤进一个 PR，
      # 既没法按家族审、也没法按家族回滚，peer 键改写和真实升级混在同一次 diff 里。
      #
      # 每组都保留 update-types: [minor, patch]，与拆分前语义等价：major 一律走人工立项
      # （ADR-014），不让机器人周期性重建合不进去的红 PR（#15/#16 的先例）。
      # patterns 之间必须互斥（`@types/node` 不会吞 `@types/nodemailer`，glob 按整名匹配）。
      eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
        update-types: ["minor", "patch"]
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      next:
        patterns:
          - "next"
          - "@next/*"
        update-types: ["minor", "patch"]
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types: ["minor", "patch"]
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
        update-types: ["minor", "patch"]
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types: ["minor", "patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "jsdom"
        update-types: ["minor", "patch"]
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
        update-types: ["minor", "patch"]
      livekit:
        patterns:
          - "livekit-client"
          - "livekit-server-sdk"
          - "@livekit/*"
        update-types: ["minor", "patch"]
      auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
        update-types: ["minor", "patch"]
      mail:
        patterns:
          - "nodemailer"
          - "@types/nodemailer"
        update-types: ["minor", "patch"]
      node-types:
        patterns:
          - "@types/node"
        update-types: ["minor", "patch"]
      motion:
        patterns:
          - "framer-motion"
          - "lucide-react"
        update-types: ["minor", "patch"]
      virtual-list:
        patterns:
          - "@tanstack/*"
          - "react-grid-layout"
        update-types: ["minor", "patch"]
    ignore:
      # Stripe major：ADR-014 §4.2.4 明确否决 23.0.0（触发条件：23.x 累计 ≥3 补丁
      # 且沙箱跑通全链路）。2026-10-10 已完成 18.3.0→22.6.2（见 §12）；Dependabot
      # 不等触发条件，按 prisma 同款先例加 major ignore。
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # Prisma major 是独立工程项目而非一次版本 bump（v6→v7 需 prisma.config.ts +
      # driver adapter + Dockerfile/部署脚本适配，见 issue #32 与 ADR-014 §4.3）；
      # 2026-10-10 的 chore/prisma-7-upgrade 批次已完成 6→7。后续 major 一律人工
      # 立项，禁止 Dependabot 周期性重建合不进去的红 PR（#15/#16 的先例）。
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 自身版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
