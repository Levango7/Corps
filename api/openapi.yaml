          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Decision'
            page:
              type: integer
              description: Current page number.
            limit:
              type: integer
              description: Page size used for this query.
            total:
              type: integer
              description: Total count of decisions matching the query.
            hasMore: { type: boolean }
    # R8C-06：任务级决策列表（无分页参数，仅 items + total）
    Envelope_TaskDecisionList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Decision'
            total:
              type: integer
              description: Total count of decision records for this task.
    Envelope_Checkout:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/CheckoutSession'
    Envelope_BillingStatus:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/BillingStatus'
    Envelope_User:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/User'
    Envelope_DecisionVersionList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DecisionVersion'
    Envelope_Search:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/SearchData'
    SearchData:
      type: object
      required: [tasks, decisions]
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [task] }
              title: { type: string }
              status: { type: string, enum: [todo, in_progress, review, done] }
              priority: { type: string, enum: [low, medium, high, urgent] }
        decisions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [decision] }
              title: { type: string }
              snippet: { type: string }
              taskId: { type: string, format: uuid }
              href: { type: string }

    # ---- users ----
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
        email:
          type: string
          format: email
        image:
          nullable: true
          type: string
          description: Avatar URL (http(s) only).
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          nullable: true
          type: string
          format: date-time

    # ---- notifications ----
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: decision_updated
        entityId:
          nullable: true
          type: string
          format: uuid
        entityTitle:
          nullable: true
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ---- decisions ----
    DecisionVersion:
      type: object
      required: [id, decisionId, markdown, version, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        markdown:
          type: string
        version:
          type: integer
        authorId:
          type: string
          format: uuid
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
        createdAt:
          type: string
          format: date-time

    # ---- auth ----
    RegisterRequest:
      type: object
      required: [email, password, workspaceName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Optional display name; defaults to email local-part when omitted.
        workspaceName:
          type: string
          minLength: 2
          maxLength: 100
        clientSessionId:
          type: string
          maxLength: 64
          description: Optional client session id for analytics attribution.
        inviteToken:
          type: string
          maxLength: 256
          description: Optional invite token for channel attribution.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        wid:
          type: string
          format: uuid
          description: "工作区ID（可选）"
    # ---- auth responses (cookie-based: refresh token lives in Better Auth
    #      session cookie, never in the response body) ----
    # accessToken 通过 httpOnly access_token cookie 下发（15 min），不在响应体中暴露（防 XSS 窃取）
    RegisterResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
    LoginResponse:
      type: object
      required: [user, workspaces]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        workspaces:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              role: { type: string, enum: [owner, admin, member] }
    RefreshResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          type: object
          required: [id, name, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            role: { type: string, enum: [owner, admin, member] }

    # ---- workspaces ----
    Workspace:
      type: object
      required: [id, name, slug, plan, seatLimit, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [free, pro]
        seatLimit:
          type: integer
        role:
          type: string
          enum: [owner, admin, member]
          description: Caller's role in this workspace.
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100

    # ---- tasks ----
    Task:
      type: object
      required: [id, workspaceId, title, status, priority, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          nullable: true
          type: string
          format: uuid
        dueDate:
          nullable: true
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double
        milestoneId:
          type: string
          format: uuid
          nullable: true
          description: Optional milestone to associate. null removes the association.
        labelIds:
          type: array
          items:
            type: string
            format: uuid
          description: Optional list of label ids to associate (must belong to the workspace).
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Optional parent task id (one-level hierarchy only). null removes the association.
        blocked:
          type: boolean
          description: Whether the task is blocked. Defaults to false.
        blockedReason:
          type: string
          maxLength: 500
          nullable: true
          description: Optional reason text when blocked is true.
    UpdateTaskRequest:
      type: object
      description: Partial update. Any subset of fields may be sent.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          nullable: true
          type: string
          format: uuid
        dueDate:
          nullable: true
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double
        blocked:
          type: boolean
          description: Whether the task is blocked.
        blockedReason:
          type: string
          maxLength: 500
          nullable: true
          description: Optional reason text when blocked is true.
        shareToken:
          type: string
          maxLength: 64
          nullable: true
          description: >-
            Public share token. Send "rotate" to generate a new token, null to cancel sharing.

    # ---- members (shape mirrors the actual listMembers response) ----
    Member:
      type: object
      required: [id, email, name, role, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        image:
          nullable: true
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        isSelf:
          type: boolean
          description: true when this member row belongs to the caller.
        joinedAt:
          type: string
          format: date-time
    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
          default: member

    # ---- comments ----
    Comment:
      type: object
      required: [id, taskId, authorId, body, mentions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        mentions:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    Label:
      type: object
      required: [id, workspaceId, name, color, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Milestone:
      type: object
      required: [id, workspaceId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        dueDate:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        mentions:
          type: array
          items:
            type: string
            format: uuid

    # ---- decisions ----
    Decision:
      type: object
      required: [id, taskId, markdown, version, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        markdown:
          type: string
        version:
          type: integer
        authorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDecisionRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 50000
    UpdateDecisionRequest:
      type: object
      required: [markdown, baseVersion]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 50000
        baseVersion:
          type: integer
          description: Optimistic concurrency baseline; mismatch returns 409.

    # ---- billing ----
    CheckoutRequest:
      type: object
      properties:
        priceId:
          type: string
          description: Stripe Price ID. Defaults to env STRIPE_PRICE_ID when omitted.
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        period:
          type: string
          enum: [monthly, yearly]
          description: Billing cycle. Defaults to monthly when omitted; invalid values are rejected with 400.
        provider:
          type: string
          enum: [stripe, wechatpay-native, alipay-page]
          description: Payment channel. Defaults to env PAYMENT_PROVIDER when omitted; explicit value overrides the default for frontend payment-method selection.
    CheckoutSession:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Redirect URL for Stripe Checkout / Alipay gateway / Billing Portal. Present for stripe and alipay-page channels; absent for wechatpay-native (use qrCodeUrl instead).
        qrCodeUrl:
          type: string
          description: WeChat Pay code_url for QR rendering. Present for the wechatpay-native channel; absent for stripe and alipay-page.
        providerOrderId:
          type: string
          description: Channel-side order/session identifier created by the payment provider.
        providerId:
          type: string
          enum: [stripe, wechatpay-native, alipay-page]
          description: Payment channel that handled this checkout session.
    BillingStatus:
      type: object
      required: [plan, seatLimit, memberCount, seatsUsed, role, stripeReady, portalReady, subscription]
      properties:
        plan:
          type: string
          enum: [free, pro]
        seatLimit:
          type: integer
          description: Max members allowed on current plan.
        memberCount:
          type: integer
          description: Current active member count.
        seatsUsed:
          type: integer
          description: Alias of memberCount; seats currently consumed.
        role:
          type: string
          description: Caller's membership role in this workspace (e.g. owner/admin/member).
        stripeReady:
          type: boolean
          description: Whether a payment provider is configured and its price is ready (hides upgrade entry when false).
        portalReady:
          type: boolean
          description: Whether the channel supports a customer portal and stripeReady is true (hides "manage subscription" button when false).
        subscription:
          nullable: true
          type: object
          properties:
            status:
              type: string
              enum: [active, past_due, trialing, canceled]
            quantity:
              type: integer
            currentPeriodEnd:
              nullable: true
              type: string
              format: date-time
            canManage:
              type: boolean
              description: true when a provider-side order exists and portalReady (Portal available).

    # ---- F1: decision action sync ----
    ActionSyncResponse:
      type: object
      required: [created, updated, removed, tasks]
      properties:
        created:
          type: integer
          description: Number of new tasks created from action items.
          example: 2
        updated:
          type: integer
          description: Number of existing tasks updated (title changed).
          example: 1
        removed:
          type: integer
          description: Number of stale action items removed (tasks deleted).
          example: 0
        tasks:
          type: array
          description: Full list of synced tasks after the operation.
          items:
            $ref: '#/components/schemas/Task'
    Envelope_ActionSyncResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/ActionSyncResponse'

    # ---- F2: permission matrix ----
    PermissionOverride:
      type: object
      required: [role, module, actions]
      properties:
        role:
          type: string
          enum: [member, viewer]
          description: Role whose permissions are overridden. Owner/admin cannot be overridden.
        module:
          type: string
          description: Module key (e.g. tasks, decisions, documents, members, billing, analytics, settings).
          example: tasks
        actions:
          type: array
          items:
            type: string
            enum: [read, create, update, delete]
          description: Allowed actions for this role+module. Absent actions are denied.
          example: [read]
    PermissionMatrix:
      type: object
      required: [roles, overrides]
      properties:
        roles:
          type: array
          description: Ordered list of role permission rows (owner, admin, member, viewer).
          items:
            type: object
            required: [role, modules]
            properties:
              role:
                type: string
                enum: [owner, admin, member, viewer]
              locked:
                type: boolean
                description: true when this role row cannot be modified (owner is always locked).
              modules:
                type: array
                items:
                  type: object
                  required: [module, actions]
                  properties:
                    module:
                      type: string
                      description: Module key.
                    actions:
                      type: array
                      items:
                        type: string
                        enum: [read, create, update, delete]
                      description: Allowed actions for this role+module.
        overrides:
          type: array
          description: Active permission overrides (only member/viewer rows can have overrides).
          items:
            $ref: '#/components/schemas/PermissionOverride'
    Envelope_PermissionMatrix:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/PermissionMatrix'
    UpdatePermissionRequest:
      type: object
      required: [role, module, actions]
      properties:
        role:
          type: string
          enum: [member, viewer]
          description: Target role to override. Owner/admin are rejected with 400.
        module:
          type: string
          minLength: 1
          maxLength: 50
          description: Module key (e.g. tasks, decisions, documents).
        actions:
          type: array
          items:
            type: string
            enum: [read, create, update, delete]
          description: Allowed actions. Empty array denies all actions for this role+module.

    # ---- F3: dashboard ----
    # react-grid-layout item shape (subset of RGLItem; the client persists the
    # full RGL item, the server stores it opaquely and returns it as-is).
    TemporaryGrant:
      type: object
      required: [id, userId, tempRole, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Grant record id.
        userId:
          type: string
          format: uuid
          description: Target user id receiving the temporary role.
        tempRole:
          type: string
          enum: [admin, member]
          description: Temporary elevated role granted to the user.
        expiresAt:
          type: string
          format: date-time
          description: When the grant expires and the user reverts to their permanent role.
        createdAt:
          type: string
          format: date-time
          description: When the grant was created.
        reason:
          type: string
          maxLength: 500
          description: Optional reason for the grant (provided by the admin).
        grantedBy:
          type: string
          format: uuid
          description: User id of the admin who created the grant.
    RGLItem:
      type: object
      required: [i, x, y, w, h]
      properties:
        i:
          type: string
          description: Widget instance id (widgetId or a composite key).
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        w:
          type: integer
          minimum: 1
        h:
          type: integer
          minimum: 1
        minW:
          type: integer
          minimum: 1
        minH:
          type: integer
          minimum: 1
        maxW:
          type: integer
          minimum: 1
        maxH:
          type: integer
          minimum: 1
        moved:
          type: boolean
        static:
          type: boolean
    DashboardLayout:
      type: object
      required: [layout, breakpoint]
      properties:
        layout:
          type: array
          description: Ordered react-grid-layout items for the calling user.
          items:
            $ref: '#/components/schemas/RGLItem'
        breakpoint:
          type: string
          description: Active responsive breakpoint label (e.g. lg, md, sm, xs).
          example: lg
    DashboardLayoutUpdateRequest:
      type: object
      required: [layout]
      properties:
        layout:
          type: array
          description: >
            Full react-grid-layout items to persist for the calling user. An empty
            array resets the layout to server defaults on next read.
          items:
            $ref: '#/components/schemas/RGLItem'
        breakpoint:
          type: string
          description: Optional responsive breakpoint label to persist alongside the layout.
          example: lg
    Envelope_DashboardLayout:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/DashboardLayout'
    # Widget data is dynamic per widget kind; the server returns an opaque object
    # and the client branches on widgetId/kind.
    Envelope_WidgetData:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          description: >
            Dynamic widget payload. Shape varies by widget kind, e.g.
            tasks-summary → { total, byStatus: {todo,in_progress,review,done} };
            recent-activity → { items: [{id, kind, title, at}] };
            burndown → { points: [{day, remaining}] }. The client must branch on
            widgetId/kind.
          additionalProperties: true

    # ---- F5: sharing ----
    ShareSettings:
      type: object
      required: [hasPassword]
      properties:
        shareToken:
          type: string
          nullable: true
          description: Public share token (present when sharing has ever been enabled).
        shareExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry timestamp; null means no expiry.
        hasPassword:
          type: boolean
          description: >
            Whether a share password is currently set. The raw password is never
            returned; this flag drives the "password protected" UI state.
    ShareSettingsUpdateRequest:
      type: object
      description: Partial update; any subset of fields may be sent.
      properties:

        shareExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 expiry; null clears the expiry.
        sharePassword:
          type: string
          nullable: true
          maxLength: 128
          description: >
            New password to set. null clears the password. An empty string is
            treated as a validation error (use null to clear).
    Envelope_ShareSettings:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/ShareSettings'
    ShareVerifyRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Share password to verify.
    ShareVerifyResponse:
      type: object
      required: [id, title, markdown]
      properties:
        id:
          type: string
          format: uuid
          description: Id of the shared resource (document or task).
        title:
          type: string
          description: Title of the shared resource.
        markdown:
          type: string
          nullable: true
          description: >
            Published markdown content of the shared document. Present for
            documents; null for tasks (tasks have no published markdown body).
    Envelope_ShareVerifyResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/ShareVerifyResponse'
    ShareAccessLog:
      type: object
      required: [id, accessedAt]
      properties:
        id:
          type: string
          format: uuid
        accessedAt:
          type: string
          format: date-time
        ip:
          type: string
          nullable: true
          description: Viewer IP address (best-effort, may be redacted by proxy).
        userAgent:
          type: string
          nullable: true
          description: Viewer User-Agent header.
    Envelope_ShareAccessLogList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [items, page, pageSize, total, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ShareAccessLog'
            page:
              type: integer
              description: Current page number.
            pageSize:
              type: integer
              description: Page size used for this query.
            total:
              type: integer
              description: Total count of access log entries.
            hasMore: { type: boolean }
    ActivityItem:
      type: object
      required: [id, type, actorId, actorName, entityType, entityId, entityTitle, createdAt]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [task.created, task.updated, comment.created, decision.created, decision.updated]
        actorId: { type: string }
        actorName: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        entityTitle: { type: string }
        createdAt: { type: string, format: date-time }
    Envelope_ActivityFeed:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/ActivityItem'
            nextCursor:
              type: string
              nullable: true
              description: ISO timestamp of the last item; null when the feed is exhausted.
    Announcement:
      type: object
      required: [id, title, content, type, pinned, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        type: { type: string, enum: [info, warning, urgent] }
        targetAudience:
          type: object
          description: "{ type: all|role|department, value?: string[] }"
