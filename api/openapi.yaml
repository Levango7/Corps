components:
  securitySchemes:
    cronSecret:
      type: http
      scheme: bearer
      description: Shared secret (CRON_SECRET env) for scheduled job endpoints.
    metricsToken:
      type: http
      scheme: bearer
      description: >-
        Optional shared secret (METRICS_TOKEN env). Only enforced when the
        variable is set; otherwise /api/metrics is open and must be restricted
        at the network layer.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (15 min) in Authorization header. workspace_id resolved from JWT claim `wid`.
    refreshAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >
        Better Auth session cookie (httpOnly, secure, 7-day). The /api/v1/auth/refresh
        endpoint reads this cookie to re-issue a workspace-scoped access JWT.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC-SHA256 signature of the raw body using the Stripe webhook secret.

  parameters:
    Wid:
      name: wid
      in: path
      required: true
      description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403/404.
      schema: { type: string, format: uuid }
    TaskId:
      name: id
      in: path
      required: true
      description: Task id (UUID).
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: User id (UUID) of the member to update or remove.
      schema: { type: string, format: uuid }
    Did:
      name: did
      in: path
      required: true
      description: Decision id (UUID).
      schema: { type: string, format: uuid }
    DocumentId:
      name: id
      in: path
      required: true
      description: Document id (UUID).
      schema: { type: string, format: uuid }
    WidgetId:
      name: widgetId
      in: path
      required: true
      description: >
        Widget id (kind-qualified). Allowed values: "task-stats", "my-tasks",
        "decision-actions", "due-this-week", "team-load", "burndown",
        "priority-dist", "recent-activity".
      schema: { type: string, minLength: 1, maxLength: 64 }
    AgentId:
      name: id
      in: path
      required: true
      description: AI agent id (UUID).
      schema: { type: string, format: uuid }
    AnnouncementId:
      name: aid
      in: path
      required: true
      description: Announcement id (UUID).
      schema: { type: string, format: uuid }
    ContactId:
      name: cid
      in: path
      required: true
      description: Contact id (UUID).
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      description: Calendar event id (UUID).
      schema: { type: string, format: uuid }
    ObjectiveId:
      name: oid
      in: path
      required: true
      description: OKR objective id (UUID).
      schema: { type: string, format: uuid }
    KeyResultId:
      name: kid
      in: path
      required: true
      description: Key result id (UUID).
      schema: { type: string, format: uuid }
    Mid:
      name: mid
      in: path
      required: true
      description: Meeting id (UUID).
      schema: { type: string, format: uuid }
    Teid:
      name: teid
      in: path
      required: true
      description: Time entry id (UUID).
      schema: { type: string, format: uuid }
    WikiPageId:
      name: pageId
      in: path
      required: true
      description: Wiki page id (UUID).
      schema: { type: string, format: uuid }
    Wbid:
      name: wbid
      in: path
      required: true
      description: Whiteboard id (UUID).
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation error (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 400
            data: null
            message: "email must be a valid address"
    Unauthorized:
      description: Missing or invalid token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 401
            data: null
            message: "invalid or expired access token"
    Forbidden:
      description: Authenticated but not permitted (RBAC / tenant mismatch) (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 403
            data: null
            message: "role 'member' cannot perform this action"
    NotFound:
      description: Resource unknown to caller (RLS-filtered) (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 404
            data: null
            message: "workspace not found"
    RateLimited:
      description: Per-route rate limit exceeded (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 429
            data: null
            message: "rate limit exceeded, retry later"
    Conflict:
      description: Resource conflict (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 409
            data: null
            message: "email already registered"
    PaymentNotConfigured:
      description: Payment provider not configured (501)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 501
            data: null
            message: "payment provider not configured"
    InternalError:
      description: Internal server error (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 500
            data: null
            message: "internal server error"
    PaymentRequired:
      description: Payment required — seat limit exceeded or plan upgrade needed (402)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: integer
                example: 402
              data:
                oneOf:
                  - type: 'null'
                    description: No seat-limit context available (generic plan-upgrade prompt).
                  - type: object
                    properties:
                      seatLimit:
                        type: integer
                        description: Current seat limit of the workspace (when exceeded).
              message:
                type: string
                example: "seats are full; upgrade your plan to invite more members"
          example:
            code: 402
            data: null
            message: "seats are full; upgrade your plan to invite more members"
    TooManyRequests:
      description: Rate limit exceeded (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 429
            data: null
            message: "too many requests; please try again later"

  schemas:
    # ---- uniform envelope ----
    Envelope:
      type: object
      required: [code]
      properties:
        code:
          type: integer
          description: "Business status code, mirrors HTTP status code (200=success, 4xx/5xx=error)"
          example: 200
        data:
          nullable: true
        message:
          type: string
          description: "Human-readable status message. Required for error responses (4xx/5xx), optional for success responses (2xx)."
          example: "ok"
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 401
        data:
          nullable: true
          example: null
        message:
          type: string
          example: "invalid or expired access token"
        # L4：events POST 400 等校验失败响应会附带 zod errors 数组，
        # 此前未在 ErrorEnvelope 中文档化。这里补为可选字段（未列入 required），
        # 既覆盖现有带 errors 的 4xx 响应，也不破坏只返回 {code,message,data} 的错误响应。
        errors:
          type: array
          description: >
            Optional field-level validation errors (e.g. zod issues) for 4xx
            responses. Absent on non-validation errors.
          items:
            type: object
            description: A single validation issue (path/message/code as produced by zod).
    Envelope_Null:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          nullable: true
    # L2：Stripe webhook 200 实际返回 { received: true } 或 { received: true, duplicate: true }，
    # 此前误用 Envelope_Null（data:null），与实现不一致。这里定义专用 envelope，
    # data 形状为 { received: boolean, duplicate?: boolean }，与 route.ts 两处 200 应答对齐。
    Envelope_WebhookReceived:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [received]
          properties:
            received:
              type: boolean
              description: Whether the webhook event was accepted.
              example: true
            duplicate:
              type: boolean
              description: >
                Present and true when the event was already processed (idempotent
                hit via processed_payment_events). Absent on first processing.
              example: true
    Envelope_RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/RegisterResponse'
    Envelope_LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
    Envelope_RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/RefreshResponse'
    Envelope_Workspace:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Workspace'
    Envelope_WorkspaceList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    Envelope_Task:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Task'
    Envelope_TaskList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [items, page, limit, total, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0 }
            hasMore: { type: boolean }
    Envelope_Member:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Member'
    Envelope_InviteResult:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Member'
            - $ref: '#/components/schemas/PendingInvite'
    PendingInvite:
      type: object
      required: [pending, email, inviteUrl]
      properties:
        pending:
          type: boolean
          description: Always true; indicates the invitee is not yet registered.
        email:
          type: string
          format: email
        inviteUrl:
          type: string
          format: uri
          description: One-time signup URL carrying the invite token.
    Envelope_MemberList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
          required: [items, page, limit, total, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            page:
              type: integer
              description: Current page number.
            limit:
              type: integer
              description: Page size used for this query.
            total:
              type: integer
              description: Total count of members matching the query.
            hasMore: { type: boolean }
    Envelope_Comment:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Comment'
    Envelope_CommentList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    Envelope_Label:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Label'
    Envelope_LabelList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    Envelope_Milestone:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Milestone'
    Envelope_MilestoneList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
    Envelope_Decision:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Decision'
    Envelope_DecisionList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: object
