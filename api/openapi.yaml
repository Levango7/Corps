openapi: 3.0.3
info:
  title: corps (团队) API
  version: 1.0.0
  description: >
    MVP API for the corps multi-tenant collaboration SaaS. This document is the
    single contract for frontend and backend in Phase 3. All paths are prefixed with
    /api/v1/. Every response uses the uniform envelope { code, data, message }.
    Multi-tenant access control: every {wid} route verifies the caller's membership
    row for that workspace, then runs all tenant queries inside a transaction with
    app.workspace_id / app.user_id set (RLS binds at engine level in hardened
    deployments — see db/schema.sql).
    This contract currently defines 25 paths (updated 2026-08-24).
  contact:
    name: MVP Dev Expert Team — Architecture
servers:
  - url: http://localhost:3000
    description: Local development (Next.js Route Handlers)
  - url: https://{env}.corps.app
    description: CloudBase deployment
    variables:
      env:
        default: staging

tags:
  - name: auth
    description: Registration, login, token refresh, logout
  - name: users
    description: Current user profile
  - name: workspaces
    description: Workspace (tenant) listing, creation and detail/update
  - name: tasks
    description: Kanban task CRUD within a workspace (incl. batch ops)
  - name: members
    description: Workspace membership and role-based access control
  - name: comments
    description: Task-scoped comments with @mentions
  - name: decisions
    description: Task-linked decision records (Markdown, versioned)
  - name: notifications
    description: Per-user notification list and read state
  - name: analytics
    description: Workspace-level analytics overview (owner/admin)
  - name: events
    description: Client analytics event ingestion
  - name: billing
    description: Stripe Checkout / Portal / webhook

security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a user and create their first workspace (owner)
      description: >
        Calls Better Auth signUpEmail (password hashed by Better Auth) to create the user
        and session, then provisions a workspace and a members row with role `owner`.
        Returns a workspace-scoped access JWT (15 min) for RLS. Covers AC-01 (201 + JWT +
        workspace) and AC-02 (409 on duplicate email). The Better Auth session cookie is
        set on the response.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email + password
      description: >
        Calls Better Auth signInEmail (password verified by Better Auth), then returns the
        user's workspaces and a workspace-scoped access JWT (15 min) for the primary
        workspace. The Better Auth session cookie is set on the response.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh the workspace-scoped access JWT
      description: >
        Uses the Better Auth session cookie (7-day) to issue a new 15-min access JWT,
        optionally scoped to a `workspaceId` the user belongs to (defaults to the first).
        The new token is also set as the httpOnly `access_token` cookie.
      security:
        - refreshAuth: []
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Access token re-issued
          headers:
            Set-Cookie:
              description: Re-issued httpOnly access_token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (clear Better Auth session + access_token cookie)
      description: >
        Calls Better Auth signOut (tolerates an already-expired/missing session) and
        expires the httpOnly `access_token` cookie. Always returns 200. Note: the
        handler responds with { code, data } only — `message` may be omitted.
      operationId: logout
      responses:
        '200':
          description: Session cleared
          headers:
            Set-Cookie:
              description: Expired httpOnly access_token cookie (maxAge=0)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'

  # ===========================================================================
  # USERS
  # ===========================================================================
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get the current user's profile
      description: >
        Resolves the caller via the Better Auth session first, falling back to the
        Bearer access JWT — both cookie and token authentication are supported.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Update the current user's profile (name / image)
      description: >
        Partial update of `name` (1-100 chars) and/or `image` (must be an http(s)
        URL or null; pseudo-protocols like file:/javascript: are rejected).
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                image:
                  nullable: true
                  type: string
                  format: uri
                  pattern: '^https?://\\S+$'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # WORKSPACES
  # ===========================================================================
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List my workspaces
      description: Returns every workspace the authenticated user is a member of.
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_WorkspaceList'
    post:
      tags: [workspaces]
      summary: Create a workspace
      description: >
        Provisions a new workspace owned by the authenticated user, with a members row
        of role `owner`. seat_limit defaults to 10 (free plan).
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/workspaces/{wid}:
    get:
      tags: [workspaces]
      summary: Workspace detail (settings page / top bar)
      description: >
        Returns the workspace profile plus member/task counts and the caller's role.
        Membership required; unknown-to-caller workspaces resolve to 404 (RLS-filtered).
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Workspace detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [id, name, slug, plan, seatLimit, memberCount, taskCount, role]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      slug: { type: string }
                      plan: { type: string, enum: [free, pro] }
                      seatLimit: { type: integer }
                      memberCount: { type: integer }
                      taskCount: { type: integer }
                      role: { type: string, enum: [owner, admin, member] }
                      createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [workspaces]
      summary: Rename a workspace and/or change its slug (owner/admin)
      description: >
        Owner/Admin only (member → 403). `name` is 2-64 chars; `slug` is 2-48 chars,
        lowercase letters/digits/hyphens only. Duplicate slug returns 409.
      operationId: updateWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 64
                slug:
                  type: string
                  minLength: 2
                  maxLength: 48
                  pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      slug: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===========================================================================
  # SEARCH
  # ===========================================================================
  /api/v1/workspaces/{wid}/search:
    get:
      tags: [workspaces]
      summary: Search tasks and decisions within a workspace
      description: >
        Case-insensitive substring match over task title/description and decision
        markdown. Used by the command palette (Cmd+K).
      operationId: searchWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Matching tasks and decisions
          content:
            application/json:
              schema:
                type: object
                required: [tasks, decisions]
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [task] }
                        title: { type: string }
                        status: { type: string, enum: [todo, in_progress, review, done] }
                        priority: { type: string, enum: [low, medium, high, urgent] }
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [decision] }
                        title: { type: string }
                        snippet: { type: string }
                        taskId: { type: string, format: uuid }
                        href: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===========================================================================
  # TASKS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks:
    get:
      tags: [tasks]
      summary: List tasks in a workspace (board / list view)
      description: >
        Returns tasks filtered by RLS to the workspace in the JWT. Supports status and
        assignee filters and ordering by sort_order. Covers AC-03/AC-04 (RLS isolation).
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, review, done] }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: view
          in: query
          schema: { type: string, enum: [board, list], default: board }
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_TaskList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tasks]
      summary: Create a task
      description: Creates a task in the workspace. assignee_id is optional (unassigned).
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/tasks/{id}:
    patch:
      tags: [tasks]
      summary: Update a task (includes drag-to-change-status)
      description: >
        Partial update. Changing `status` is how the kanban drag persists (AC-06).
        Optimistic update on the client; this is the server persistence.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tasks]
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/tasks/batch:
    post:
      tags: [tasks]
      summary: Batch update or delete tasks (max 100 ids)
      description: >
        action=update applies the provided optional fields (status / priority /
        assigneeId / dueDate) to all valid ids; action=delete removes them. Ids not
        belonging to this workspace are reported in `skipped` instead of failing.
        Changing `assigneeId` requires owner/admin (member → 403); the assignee must
        be a member of this workspace (400 otherwise).
      operationId: batchTasks
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
                action:
                  type: string
                  enum: [update, delete]
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                assigneeId:
                  nullable: true
                  type: string
                  format: uuid
                dueDate:
                  nullable: true
                  type: string
                  format: date-time
      responses:
        '200':
          description: Batch result (partial success)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [updated, deleted, skipped]
                    properties:
                      updated: { type: integer }
                      deleted: { type: integer }
                      skipped:
                        type: array
                        description: Ids not belonging to this workspace.
                        items: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # MEMBERS
  # ===========================================================================
  /api/v1/workspaces/{wid}/members:
    get:
      tags: [members]
      summary: List workspace members
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MemberList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/members/invite:
    post:
      tags: [members]
      summary: Invite a member
      description: >
        Owner/Admin only (AC-05: Member returns 403). If the email maps to an existing
        user, a members row is created directly; otherwise an invite (pending member)
        is recorded and an email is sent. Rejects when seat_limit would be exceeded.
      operationId: inviteMember
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invitation created or member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/workspaces/{wid}/members/{uid}:
    patch:
      tags: [members]
      summary: Change a member's role (owner/admin)
      description: >
        Owner/Admin only (member → 403). Allowed target roles are `admin` / `member`;
        the workspace owner's role cannot be changed (403). Unknown member → 404.
      operationId: updateMemberRole
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      role: { type: string, enum: [admin, member] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [members]
      summary: Remove a member
      description: Owner/Admin only. Removing the last owner is rejected (400).
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # COMMENTS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks/{id}/comments:
    post:
      tags: [comments]
      summary: Add a comment with @mentions
      description: >
        Creates a comment bound to the task. `mentions` is an array of user_ids that
        triggers notifications. Body must not be empty.
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # DECISIONS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks/{id}/decisions:
    get:
      tags: [decisions]
      summary: List decision records for a task
      description: Returns the latest version of each decision linked to the task.
      operationId: listDecisions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Decision list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DecisionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [decisions]
      summary: Create a decision record (version 1)
      description: >
        Creates a decision record (Markdown) linked to the task and appends a version
        history row. Covers AC-10 (version留痕 + bidirectional link).
      operationId: createDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}:
    # Extension beyond Spec section 5 (GET/POST only) — added so AC-10 editing path
    # is fully specified. Marked ADDED.
    patch:
      tags: [decisions]
      summary: '[ADDED] Edit a decision record (bumps version)'
      description: >
        Updates the Markdown, increments `version` on the decisions row, and appends a
        new decision_versions history row. Optimistic concurrency via `base_version`.
      operationId: updateDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: Decision updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}/versions:
    get:
      tags: [decisions]
      summary: Version history of a decision (newest first)
      description: >
        Returns all `decision_versions` rows of the decision, ordered by version
        descending with author info. The decision must belong to the given task and
        workspace — otherwise 404 (prevents cross-task reads).
      operationId: listDecisionVersions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DecisionVersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # ANALYTICS & NOTIFICATIONS & EVENTS
  # ===========================================================================
  /api/v1/workspaces/{wid}/analytics/overview:
    get:
      tags: [analytics]
      summary: Workspace analytics overview (owner/admin)
      description: >
        Owner/Admin only (member → 403). Aggregates the last 14 days of workspace
        events (RLS-scoped): funnel step user counts with conversion rates,
        per-day event counts, top-8 event names, total event count and distinct
        active users.
      operationId: getAnalyticsOverview
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          days: { type: integer, example: 14 }
                          since: { type: string, format: date-time }
                      funnel:
                        type: array
                        description: register → login → create_task → invite_member → create_decision
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            label: { type: string }
                            users: { type: integer }
                            rate: { type: integer, description: Conversion vs previous step (%) }
                      daily:
                        type: array
                        items:
                          type: object
                          description: '{ date, _total, <eventName>: count }'
                      topEvents:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            count: { type: integer }
                      totalEvents: { type: integer }
                      activeUsers: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{wid}/notifications:
    get:
      tags: [notifications]
      summary: List my notifications in this workspace / unread count
      description: >
        Returns up to 50 notifications of the caller (createdAt desc), scoped to both
        user and workspace. Query flags: `unread=true` filters unread only;
        `count=true` returns `{ unread }` instead of the list.
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: unread
          in: query
          schema: { type: string, enum: ['true'] }
        - name: count
          in: query
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: Notification list or unread count
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 200 }
                      data:
                        type: object
                        properties:
                          notifications:
                            type: array
                            items:
                              $ref: '#/components/schemas/Notification'
                  - type: object
                    properties:
                      code: { type: integer, example: 200 }
                      data:
                        type: object
                        properties:
                          unread: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [notifications]
      summary: Mark notifications as read (single or all)
      description: >
        Body must provide either `id` (marks that notification, only when it belongs
        to the caller and this workspace) or `all: true` (marks every unread
        notification of the caller in this workspace). Otherwise 400.
      operationId: markNotificationsRead
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
                - type: object
                  required: [all]
                  properties:
                    all: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # BILLING
  # ===========================================================================
  /api/v1/workspaces/{wid}/billing/checkout:
    post:
      tags: [billing]
      summary: Create a Stripe Checkout Session (upgrade)
      description: >
        Owner only (AC-05). Creates a Stripe Checkout Session (mode=subscription) for the
        workspace plan; quantity is derived from `Workspace.seatLimit`. Returns the redirect
        URL. `priceId` defaults to env STRIPE_PRICE_ID. On checkout.session.completed the
        webhook writes the Subscription row and sets plan='pro'.
      operationId: createCheckout
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout session created (redirect URL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Checkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{wid}/billing/status:
    get:
      tags: [billing]
      summary: Get current plan + seat usage + subscription status
      description: >
        Returns Workspace.plan, seatLimit, current member count, and the Subscription
        status (for the billing page). Used by the frontend Billing view.
      operationId: billingStatus
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Billing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_BillingStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/billing/portal:
    post:
      tags: [billing]
      summary: Create a Stripe Customer Portal session
      description: >
        Owner only. Returns a Stripe Billing Portal URL so the customer can update payment
        method / cancel. Requires an existing Stripe customer (from a completed checkout).
      operationId: billingPortal
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Checkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/billing/webhook:
    post:
      tags: [billing]
      summary: Stripe webhook receiver
      description: >
        Verified by the `Stripe-Signature` header (webhook secret). Handles
        checkout.session.completed (workspace existence check, upsert Subscription +
        plan=pro), customer.subscription.updated (sync quantity, AC-08), and
        invoice.payment_failed (mark past_due, AC-09 — no immediate service
        interruption). The raw request body is required for signature verification.
      security:
        - stripeSignature: []
      operationId: billingWebhook
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===========================================================================
  # EVENTS
  # ===========================================================================
  /api/v1/events:
    post:
      tags: [events]
      summary: Batch-ingest client analytics events (max 50)
      description: >
        Rate-limited to 120 req/min per IP. Events are filtered against a whitelist
        aligned with the P2 funnel (register_*/login_*/onboarding_*/create_task/
        invite_member/create_decision/create_comment/task_status_change/page_view/
        workspace_switch/billing_*); non-whitelisted names are silently dropped.
        Anonymous events are allowed (userId=null); workspaceId comes from the token
        unless overridden by the event payload. Props must not contain PII.
      security:
        - bearerAuth: []
        - {}
      operationId: ingestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 64 }
                      props: { type: object, default: {} }
                      sessionId: { type: string, maxLength: 64 }
                      workspaceId: { type: string, format: uuid }
      responses:
        '200':
          description: Ingestion result ({ accepted } count)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      accepted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [events]
      summary: "[DEV ONLY] List the current user's recent events"
      description: >
        Debug helper returning the caller's last 50 events. Disabled in production
        with 403; use /workspaces/{wid}/analytics/overview there instead.
      operationId: listMyEvents
      responses:
        '200':
          description: Recent events (dev only)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (15 min) in Authorization header. workspace_id resolved from JWT claim `wid`.
    refreshAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >
        Better Auth session cookie (httpOnly, secure, 7-day). The /api/v1/auth/refresh
        endpoint reads this cookie to re-issue a workspace-scoped access JWT.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC-SHA256 signature of the raw body using the Stripe webhook secret.

  parameters:
    Wid:
      name: wid
      in: path
      required: true
      description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403/404.
      schema: { type: string, format: uuid }
    TaskId:
      name: id
      in: path
      required: true
      description: Task id (UUID).
      schema: { type: string, format: uuid }
    Uid:
      name: uid
      in: path
      required: true
      description: User id (UUID) of the member to update or remove.
      schema: { type: string, format: uuid }
    Did:
      name: did
      in: path
      required: true
      description: Decision id (UUID).
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation error (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 400
            data: null
            message: "email must be a valid address"
    Unauthorized:
      description: Missing or invalid token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 401
            data: null
            message: "invalid or expired access token"
    Forbidden:
      description: Authenticated but not permitted (RBAC / tenant mismatch) (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 403
            data: null
            message: "role 'member' cannot perform this action"
    NotFound:
      description: Resource unknown to caller (RLS-filtered) (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 404
            data: null
            message: "workspace not found"
    Conflict:
      description: Resource conflict (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 409
            data: null
            message: "email already registered"

  schemas:
    # ---- uniform envelope ----
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: "Business status code, mirrors HTTP status code (200=success, 4xx/5xx=error)"
          example: 200
        data:
          nullable: true
        message:
          type: string
          example: "ok"
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 401
        data:
          nullable: true
          example: null
        message:
          type: string
          example: "invalid or expired access token"
    Envelope_Null:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          nullable: true
    Envelope_RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/RegisterResponse'
    Envelope_LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
    Envelope_RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/RefreshResponse'
    Envelope_Workspace:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Workspace'
    Envelope_WorkspaceList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    Envelope_Task:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Task'
    Envelope_TaskList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    Envelope_Member:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Member'
    Envelope_MemberList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    Envelope_Comment:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Comment'
    Envelope_Decision:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/Decision'
    Envelope_DecisionList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    Envelope_Checkout:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/CheckoutSession'
    Envelope_BillingStatus:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/BillingStatus'
    Envelope_User:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/User'
    Envelope_DecisionVersionList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DecisionVersion'

    # ---- users ----
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
        email:
          type: string
          format: email
        image:
          nullable: true
          type: string
          description: Avatar URL (http(s) only).
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          nullable: true
          type: string
          format: date-time

    # ---- notifications ----
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: decision_updated
        entityId:
          nullable: true
          type: string
          format: uuid
        entityTitle:
          nullable: true
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ---- decisions ----
    DecisionVersion:
      type: object
      required: [id, decisionId, markdown, version, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        markdown:
          type: string
        version:
          type: integer
        authorId:
          type: string
          format: uuid
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
        createdAt:
          type: string
          format: date-time

    # ---- auth ----
    RegisterRequest:
      type: object
      required: [email, password, name, workspaceName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        workspaceName:
          type: string
          minLength: 1
          maxLength: 80
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    # ---- auth responses (cookie-based: refresh token lives in Better Auth
    #      session cookie, never in the response body) ----
    RegisterResponse:
      type: object
      required: [user, workspace, accessToken]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        accessToken:
          type: string
          description: Workspace-scoped JWT (15 min). Also set as httpOnly access_token cookie.
    LoginResponse:
      type: object
      required: [user, workspaces, accessToken]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'] }
        workspaces:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              role: { type: string, enum: [owner, admin, member] }
        accessToken:
          type: string
          description: JWT scoped to the first workspace. Also set as httpOnly access_token cookie.
    RefreshResponse:
      type: object
      required: [accessToken, workspace]
      properties:
        accessToken:
          type: string
          description: New workspace-scoped JWT (15 min).
        workspace:
          type: object
          required: [id, name, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            role: { type: string, enum: [owner, admin, member] }

    # ---- workspaces ----
    Workspace:
      type: object
      required: [id, name, slug, plan, seatLimit, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [free, pro]
        seatLimit:
          type: integer
        role:
          type: string
          enum: [owner, admin, member]
          description: Caller's role in this workspace.
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    # ---- tasks ----
    Task:
      type: object
      required: [id, workspaceId, title, status, priority, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          nullable: true
          type: string
          format: uuid
        dueDate:
          nullable: true
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          nullable: true
          type: string
          format: uuid
        dueDate:
          nullable: true
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double
    UpdateTaskRequest:
      type: object
      description: Partial update. Any subset of fields may be sent.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          nullable: true
          type: string
          format: uuid
        dueDate:
          nullable: true
          type: string
          format: date-time
        sortOrder:
          type: number
          format: double

    # ---- members (shape mirrors the actual listMembers response) ----
    Member:
      type: object
      required: [id, email, name, role, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        image:
          nullable: true
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        isSelf:
          type: boolean
          description: true when this member row belongs to the caller.
        joinedAt:
          type: string
          format: date-time
    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
          default: member

    # ---- comments ----
    Comment:
      type: object
      required: [id, taskId, authorId, body, mentions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        mentions:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        mentions:
          type: array
          items:
            type: string
            format: uuid

    # ---- decisions ----
    Decision:
      type: object
      required: [id, taskId, markdown, version, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        markdown:
          type: string
        version:
          type: integer
        authorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDecisionRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
    UpdateDecisionRequest:
      type: object
      required: [markdown, baseVersion]
      properties:
        markdown:
          type: string
          minLength: 1
        baseVersion:
          type: integer
          description: Optimistic concurrency baseline; mismatch returns 409.

    # ---- billing ----
    CheckoutRequest:
      type: object
      properties:
        priceId:
          type: string
          description: Stripe Price ID. Defaults to env STRIPE_PRICE_ID when omitted.
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Redirect URL to Stripe Checkout (or Billing Portal).
    BillingStatus:
      type: object
      required: [plan, seatLimit, memberCount, subscription]
      properties:
        plan:
          type: string
          enum: [free, pro]
        seatLimit:
          type: integer
          description: Max members allowed on current plan.
        memberCount:
          type: integer
          description: Current active member count.
        seatsUsed:
          type: integer
        subscription:
          nullable: true
          type: object
          properties:
            status:
              type: string
              enum: [active, past_due, trialing, canceled]
            quantity:
              type: integer
            currentPeriodEnd:
              nullable: true
              type: string
              format: date-time
            canManage:
              type: boolean
              description: true when a Stripe customer exists (Portal available).
