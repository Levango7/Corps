openapi: 3.0.3
info:
  title: corps (团队) API
  version: 0.6.0
  description: >
    MVP API for the corps multi-tenant collaboration SaaS. All paths are prefixed
    with /api/v1/. Every response uses the uniform envelope { code, data, message }.
    Multi-tenant access control: every {wid} route verifies the caller's membership
    row for that workspace, then runs all tenant queries inside a transaction with
    app.workspace_id / app.user_id set (RLS binds at engine level in hardened
    deployments — see db/schema.sql).
    Coverage: this contract declares 209 paths (updated 2026-10-30). The service also
    exposes additional routes that are not yet documented here; the authoritative
    gap list and its drift guard live in scripts/check_api_contract.py and
    scripts/api-contract-baseline.txt. New routes must be added here, or explicitly
    recorded in that baseline.
  contact:
    name: MVP Dev Expert Team — Architecture
servers:
  - url: http://localhost:3000
    description: Local development (Next.js Route Handlers)
  - url: https://ghcr.io/{env}/corps
    description: GHCR Docker deployment
    variables:
      env:
        default: staging

tags:
  - name: auth
    description: Registration, login, token refresh, logout
  - name: users
    description: Current user profile
  - name: workspaces
    description: Workspace (tenant) listing, creation and detail/update
  - name: tasks
    description: Kanban task CRUD within a workspace (incl. batch ops)
  - name: members
    description: Workspace membership and role-based access control
  - name: comments
    description: Task-scoped comments with @mentions
  - name: documents
    description: Workspace documents (Markdown draft, publish & share)
  - name: decisions
    description: Task-linked decision records (Markdown, versioned)
  - name: notifications
    description: Per-user notification list and read state
  - name: analytics
    description: Workspace-level analytics overview (owner/admin)
  - name: events
    description: Client analytics event ingestion
  - name: billing
    description: Stripe Checkout / Portal / webhook

  - name: system
    description: System endpoints (health / cron / uploads)
  - name: uploads
    description: File attachment serving
  - name: labels
    description: Workspace task labels
  - name: milestones
    description: Workspace milestones
  - name: messages
    description: Task-scoped realtime chat (IM)
  - name: calendar
    description: External calendar integration (Google/Outlook)
  - name: Dashboard
    description: Workspace dashboard widget layout and widget data (F3)
  - name: Sharing
    description: Document/task share settings, password verification and access logs (F5)
security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a user and create their first workspace (owner)
      description: >
        Calls Better Auth signUpEmail (password hashed by Better Auth) to create the user
        and session, then provisions a workspace and a members row with role `owner`.
        Returns a workspace-scoped access JWT (15 min) for RLS. Covers AC-01 (201 + JWT +
        workspace) and AC-02 (409 on duplicate email). The Better Auth session cookie is
        set on the response.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email + password
      description: >
        Calls Better Auth signInEmail (password verified by Better Auth), then returns the
        user's workspaces and a workspace-scoped access JWT (15 min) for the primary
        workspace. The Better Auth session cookie is set on the response.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh the workspace-scoped access JWT
      description: >
        Uses the Better Auth session cookie (7-day) to issue a new 15-min access JWT,
        optionally scoped to a `workspaceId` the user belongs to (defaults to the first).
        The new token is set only as the httpOnly `access_token` cookie (not exposed in
        the response body, to prevent XSS exfiltration).
      security:
        - refreshAuth: []
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Access token re-issued
          headers:
            Set-Cookie:
              description: Re-issued httpOnly access_token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout (clear Better Auth session + access_token cookie)
      description: >
        Calls Better Auth signOut (tolerates an already-expired/missing session) and
        expires the httpOnly `access_token` cookie. Always returns 200. Note: the
        handler responds with { code, data } only — `message` may be omitted.
      operationId: logout
      responses:
        '200':
          description: Session cleared
          headers:
            Set-Cookie:
              description: Expired httpOnly access_token cookie (maxAge=0)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'

  # ===========================================================================
  # USERS
  # ===========================================================================
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get the current user's profile
      description: >
        Resolves the caller via the Better Auth session first, falling back to the
        Bearer access JWT — both cookie and token authentication are supported.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Update the current user's profile (name / image)
      description: >
        Partial update of `name` (1-100 chars) and/or `image` (must be an http(s)
        URL or null; pseudo-protocols like file:/javascript: are rejected).
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                image:
                  nullable: true
                  type: string
                  format: uri
                  pattern: '^https?://\\S+$'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # WORKSPACES
  # ===========================================================================
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List my workspaces
      description: Returns every workspace the authenticated user is a member of.
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workspaces]
      summary: Create a workspace
      description: >
        Provisions a new workspace owned by the authenticated user, with a members row
        of role `owner`. seat_limit defaults to 10 (free plan).
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/workspaces/{wid}:
    get:
      tags: [workspaces]
      summary: Workspace detail (settings page / top bar)
      description: >
        Returns the workspace profile plus member/task counts and the caller's role.
        Membership required; unknown-to-caller workspaces resolve to 404 (RLS-filtered).
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Workspace detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [id, name, slug, plan, seatLimit, memberCount, taskCount, role]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      slug: { type: string }
                      plan: { type: string, enum: [free, pro] }
                      seatLimit: { type: integer }
                      memberCount: { type: integer }
                      taskCount: { type: integer }
                      role: { type: string, enum: [owner, admin, member, viewer] }
                      createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [workspaces]
      summary: Rename a workspace and/or change its slug (owner/admin)
      description: >
        Owner/Admin only (member → 403). `name` is 2-64 chars; `slug` is 2-48 chars,
        lowercase letters/digits/hyphens only. Duplicate slug returns 409.
      operationId: updateWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 64
                slug:
                  type: string
                  minLength: 2
                  maxLength: 48
                  pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      slug: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # SEARCH
  # ===========================================================================
  /api/v1/workspaces/{wid}/search:
    get:
      tags: [workspaces]
      summary: Search tasks and decisions within a workspace
      description: >
        Case-insensitive substring match over task title/description and decision
        markdown. Used by the command palette (Cmd+K).
      operationId: searchWorkspace
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 20, maximum: 100 }
          description: Maximum number of results to return per category (tasks/decisions), clamped to [1, 100].
      responses:
        '200':
          description: Matching tasks and decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Search'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # TASKS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks:
    get:
      tags: [tasks]
      summary: List tasks in a workspace (board / list view)
      description: >
        Returns tasks filtered by RLS to the workspace in the JWT. Supports status and
        assignee filters and ordering by sort_order. Covers AC-03/AC-04 (RLS isolation).
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: assignee
          in: query
          schema: { type: string }
          description: Filter by assignee — "me" for current user, or a member UUID.
        - name: milestone
          in: query
          schema: { type: string }
          description: Filter by milestone UUID, or "null" for tasks without a milestone.
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, review, done] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high, urgent] }
        - name: label
          in: query
          schema: { type: string }
          description: Filter by label UUID(s); comma-separated for OR semantics.
        - name: q
          in: query
          schema: { type: string }
          description: Fuzzy search across task title and description (case-insensitive).
        - name: view
          in: query
          schema: { type: string, enum: [board, list], default: board }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number for pagination (DL-8).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Page size for pagination (DL-8). Upper capped at 500 internally.
      responses:
        '200':
          description: Task list (paginated, DL-8, R8C-06 统一分页格式)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tasks]
      summary: Create a task
      description: Creates a task in the workspace. assignee_id is optional (unassigned).
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/tasks/{id}:
    get:
      tags: [tasks]
      summary: Get task detail (incl. assignee/labels/counts)
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [tasks]
      summary: Update a task (includes drag-to-change-status)
      description: >
        Partial update. Changing `status` is how the kanban drag persists (AC-06).
        Optimistic update on the client; this is the server persistence.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tasks]
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/tasks/batch:
    post:
      tags: [tasks]
      summary: Batch update or delete tasks (max 100 ids)
      description: >
        action=update applies the provided optional fields (status / priority /
        assigneeId / dueDate) to all valid ids; action=delete removes them. Ids not
        belonging to this workspace are reported in `skipped` instead of failing.
        Changing `assigneeId` requires owner/admin (member → 403); the assignee must
        be a member of this workspace (400 otherwise).
      operationId: batchTasks
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
                action:
                  type: string
                  enum: [update, delete]
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                assigneeId:
                  nullable: true
                  type: string
                  format: uuid
                dueDate:
                  nullable: true
                  type: string
                  format: date-time
      responses:
        '200':
          description: Batch result (partial success)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [updated, deleted, skipped]
                    properties:
                      updated: { type: integer }
                      deleted: { type: integer }
                      skipped:
                        type: array
                        description: Ids not belonging to this workspace.
                        items: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # MEMBERS
  # ===========================================================================
  /api/v1/workspaces/{wid}/members:
    get:
      tags: [members]
      summary: List workspace members (paginated)
      description: >
        Returns workspace members ordered by joinedAt asc with pagination.
        Query params: page (default 1), limit (default 50, max 100). Response
        envelope includes total/page/limit alongside the data array.
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/members/invite:
    post:
      tags: [members]
      summary: Invite a member
      description: >
        Owner/Admin only (AC-05: Member returns 403). If the email maps to an existing
        user, a members row is created directly; otherwise an invite (pending member)
        is recorded and an email is sent. Rejects when seat_limit would be exceeded.
      operationId: inviteMember
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invitation created or member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_InviteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/members/{userId}:
    patch:
      tags: [members]
      summary: Change a member's role (owner/admin)
      description: >
        Owner/Admin only (member → 403). Allowed target roles are `admin` / `member` /
        `viewer`（viewer = 只读成员，与 lib/permissions.ts 的 ROLES 及前端角色下拉一致）;
        the workspace owner's role cannot be changed (403). Unknown member → 404.
      operationId: updateMemberRole
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member, viewer]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      role: { type: string, enum: [admin, member, viewer] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [members]
      summary: Remove a member
      description: Owner/Admin only. Removing the last owner is rejected (400).
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # F2: Temporary permission grants (time-limited role elevation)
  /api/v1/workspaces/{wid}/members/{userId}/temporary-grants:
    post:
      tags: [members]
      summary: Create a temporary permission grant for a member
      description: >
        Owner/Admin only. Grants a temporary elevated role (admin/member) to the
        target user that automatically expires after the specified duration. At
        expiry, the user's role reverts to their permanent role. A user can have
        at most one active temporary grant at a time; creating a new grant when
        one is active will replace it. The reason field is optional and capped
        at 500 chars. Cannot grant on the owner or self (403).
      operationId: createTemporaryGrant
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempRole, durationHours]
              properties:
                tempRole:
                  type: string
                  enum: [admin, member]
                  description: Temporary elevated role to grant.
                durationHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  description: Grant duration in hours (1–168, i.e. up to 7 days).
                reason:
                  type: string
                  maxLength: 500
                  description: Optional human-readable reason for the grant.
      responses:
        '201':
          description: Temporary grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 201 }
                  data:
                    $ref: '#/components/schemas/TemporaryGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [members]
      summary: List temporary grants for a workspace member
      description: >
        Owner/Admin only. Returns the active temporary grant for the target user
        (if any). A user can have at most one active grant at a time; expired
        grants are not returned. Non-managers → 403.
      operationId: listTemporaryGrants
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Temporary grants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemporaryGrant'
                      total: { type: integer, example: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [members]
      summary: Revoke a temporary permission grant
      description: >
        Owner/Admin only. Immediately revokes the active temporary grant for the
        target user, reverting them to their permanent role. No-op if no active
        grant exists (returns 200). Non-managers → 403.
      operationId: revokeTemporaryGrant
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Grant revoked (or no active grant — idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # F2: Workspace permission matrix (role-based R/C/U/D overrides)
  /api/v1/workspaces/{wid}/permissions:
    get:
      tags: [members]
      summary: Get workspace permission matrix
      description: >
        Returns the merged permission matrix for all roles (default + overrides).
        The matrix maps each role (owner/admin/member/viewer) to a set of
        module→actions entries. Owner row is always full and locked; Admin can
        override Member and Viewer columns.
      operationId: getPermissionMatrix
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Permission matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_PermissionMatrix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [members]
      summary: Update permission override
      description: >
        Update permission override for a specific role and module. Only `member`
        and `viewer` roles can be overridden; attempting to override `owner` or
        `admin` returns 400. Admin/Owner only (member → 403).
      operationId: updatePermissionOverride
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '200':
          description: Permission override updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_PermissionMatrix'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # INVITATIONS（邀请未注册用户）
  # ===========================================================================
  /api/v1/invitations/{token}:
    get:
      tags: [members]
      summary: Preview an invitation (public)
      description: >
        Public endpoint (no auth): resolves the sha256 hash of the plaintext token
        and returns the workspace name, inviter, masked email and expiry for the
        signup page. Unknown token → 404; already accepted or expired → 410.
      operationId: previewInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      workspaceName: { type: string }
                      inviterName: { type: string }
                      emailMasked: { type: string, example: 'jo***@example.com' }
                      expiresAt: { type: string, format: date-time }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Invitation already accepted or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/invitations/{token}/accept:
    post:
      tags: [members]
      summary: Accept an invitation
      description: >
        Requires auth (Better Auth session or Bearer JWT). The logged-in user's email
        must match the invited email (case-insensitive) → otherwise 403. Joins the
        workspace inside a seat-checked RLS transaction (seat limit exceeded → 402);
        idempotent if the user is already a member. Consumed invitation → 410.
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      workspaceId: { type: string, format: uuid }
                      workspaceName: { type: string }
                      role: { type: string, enum: [admin, member] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Invitation already accepted or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 410
                data: null
                message: "invitation already accepted or expired"
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # COMMENTS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks/{id}/comments:
    get:
      tags: [comments]
      summary: List task comments
      responses:
        '200':
          description: Comment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CommentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [comments]
      summary: Add a comment with @mentions
      description: >
        Creates a comment bound to the task. `mentions` is an array of user_ids that
        triggers notifications. Body must not be empty.
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [comments]
      summary: Delete a comment
      description: >
        Deletes a comment by commentId (passed in body). Permission: comment author
        or workspace owner/admin. The comment must belong to the given task and workspace.
      operationId: deleteComment
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId]
              properties:
                commentId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [comments]
      summary: Edit a comment body
      description: >
        Edits the text of a comment by commentId (passed in body). Permission: comment
        author or workspace owner/admin. The comment must belong to the given task and
        workspace. Body must be 1–10000 chars.
      operationId: updateComment
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId, body]
              properties:
                commentId:
                  type: string
                  format: uuid
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ===========================================================================
  # DECISIONS
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks/{id}/decisions:
    get:
      tags: [decisions]
      summary: List decision records for a task
      description: Returns the latest version of each decision linked to the task.
      operationId: listDecisions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Decision list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_TaskDecisionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [decisions]
      summary: Create a decision record (version 1)
      description: >
        Creates a decision record (Markdown) linked to the task and appends a version
        history row. Covers AC-10 (version留痕 + bidirectional link).
      operationId: createDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}:
    # Extension beyond Spec section 5 (GET/POST only) — added so AC-10 editing path
    # is fully specified. Marked ADDED.
    patch:
      tags: [decisions]
      summary: '[ADDED] Edit a decision record (bumps version)'
      description: >
        Updates the Markdown, increments `version` on the decisions row, and appends a
        new decision_versions history row. Optimistic concurrency via `base_version`.
      operationId: updateDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: Decision updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}/review:
    # ADDED (#48)：人工标记「已复盘」。刻意与 PATCH .../decisions/{did} 分开——
    # 那个端点的语义是"改内容 → version+1"，带 base_version 乐观锁与免费版
    # "最近 10 条可编辑"的 402 窗口；复盘不改内容、不该进版本链，也不该被该窗口挡住
    # （回看旧决策恰恰是复盘的主要场景）。
    post:
      tags: [decisions]
      summary: '[ADDED] Mark a decision as reviewed (or undo)'
      description: >
        Sets `reviewed_at` on the decision. Idempotent: calling again with
        `reviewed: true` does not refresh the timestamp, so "first reviewed at"
        is not polluted by click counts. Emits the `decision_reviewed` analytics
        event only on the false → true transition; undoing (`reviewed: false`)
        emits nothing (it is a correction, not a review). Editing the decision
        later clears `reviewed_at` — changed content is unreviewed content.
      operationId: reviewDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewed:
                  type: boolean
                  default: true
                  description: 缺省 true（标记已复盘）；false 表示撤销复盘。
      responses:
        '200':
          description: Current review state after the call
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      reviewedAt:
                        type: string
                        format: date-time
                        nullable: true
                      changed:
                        type: boolean
                        description: 本次调用是否真的改变了状态（幂等重复调用为 false）
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}/versions:
    get:
      tags: [decisions]
      summary: Version history of a decision (newest first)
      description: >
        Returns all `decision_versions` rows of the decision, ordered by version
        descending with author info. The decision must belong to the given task and
        workspace — otherwise 404 (prevents cross-task reads).
      operationId: listDecisionVersions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DecisionVersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # F1: Sync decision action items to tasks
  /api/v1/workspaces/{wid}/tasks/{id}/decisions/{did}/sync-actions:
    post:
      tags: [decisions]
      summary: Sync decision action items to tasks
      description: >
        Parse action items from decision markdown (checkboxes / "- [ ]" lines)
        and create/update/remove corresponding tasks. Each action item is matched
        by its text hash; new items create tasks, removed items delete stale
        tasks, changed items update task titles. Returns counts of created,
        updated, and removed tasks along with the full task list.
      operationId: syncDecisionActions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Action items synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ActionSyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # ANALYTICS & NOTIFICATIONS & EVENTS
  # ===========================================================================
  /api/v1/workspaces/{wid}/analytics/overview:
    get:
      tags: [analytics]
      summary: Workspace analytics overview (owner/admin)
      description: >
        Owner/Admin only (member → 403). Aggregates the last 14 days of workspace
        events (RLS-scoped): funnel step user counts with conversion rates,
        per-day event counts, top-8 event names, total event count and distinct
        active users.
      operationId: getAnalyticsOverview
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          days: { type: integer, example: 14 }
                          since: { type: string, format: date-time }
                      funnel:
                        type: object
                        description: Two-stage serialized funnel (acquisition + activation, D2 fix)
                        properties:
                          acquisition:
                            type: array
                            description: Acquisition funnel steps (grouped by sessionId)
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                label: { type: string }
                                users: { type: integer }
                                rate: { type: integer, description: Conversion vs previous step (%) }
                          activation:
                            type: array
                            description: Activation funnel steps (grouped by userId)
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                label: { type: string }
                                users: { type: integer }
                                rate: { type: integer, description: Conversion vs previous step (%) }
                      daily:
                        type: array
                        items:
                          type: object
                          description: '{ date, _total, <eventName>: count }'
                      topEvents:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            count: { type: integer }
                      totalEvents: { type: integer }
                      eventsTruncated: { type: boolean, description: Whether event sampling was truncated due to limit }
                      eventSampleSize: { type: integer, description: Number of events actually loaded (may be less than totalEvents) }
                      activeUsers: { type: integer }
                      coreActiveUsers: { type: integer, description: Distinct users with CORE_EVENTS in the window }
                      waw:
                        type: object
                        description: Weekly active users (current workweek, work-scoped)
                        properties:
                          weekStart: { type: string }
                          users: { type: integer }
                      retention:
                        type: object
                        description: D1/D7/D30 retention rates
                        properties:
                          d1:
                            type: object
                            properties:
                              active: { type: integer }
                              eligible: { type: integer }
                              rate: { type: integer, description: Retention rate (%) }
                          d7:
                            type: object
                            properties:
                              active: { type: integer }
                              eligible: { type: integer }
                              rate: { type: integer, description: Retention rate (%) }
                          d30:
                            type: object
                            properties:
                              active: { type: integer }
                              eligible: { type: integer }
                              rate: { type: integer, description: Retention rate (%) }
                      sessions: { type: integer, description: Distinct sessionId count in the window }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{wid}/notifications:
    get:
      tags: [notifications]
      summary: List my notifications in this workspace / unread count
      description: >
        Returns notifications of the caller (createdAt desc), scoped to both user
        and workspace, with pagination. Query flags: `unread=true` filters unread
        only; `count=true` returns `{ unread }` instead of the list. Pagination
        params: page (default 1), limit (default 50, max 100). The list response
        envelope uses the unified R8C-06 shape: data.{items,page,limit,total,hasMore}.
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: unread
          in: query
          schema: { type: string, enum: ['true'] }
        - name: count
          in: query
          schema: { type: string, enum: ['true'] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Notification list or unread count
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 200 }
                      data:
                        type: object
                        required: [items, page, limit, total, hasMore]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Notification'
                          total:
                            type: integer
                            description: Total count of notifications matching the query.
                          page:
                            type: integer
                            description: Current page number.
                          limit:
                            type: integer
                            description: Page size used for this query.
                          hasMore: { type: boolean }
                  - type: object
                    properties:
                      code: { type: integer, example: 200 }
                      data:
                        type: object
                        properties:
                          unread: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [notifications]
      summary: Mark notifications as read (single or all)
      description: >
        Body must provide either `id` (marks that notification, only when it belongs
        to the caller and this workspace) or `all: true` (marks up to 500 unread
        notifications of the caller in this workspace per request). Otherwise 400.
      operationId: markNotificationsRead
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
                - type: object
                  required: [all]
                  properties:
                    all: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
                      updatedCount:
                        type: integer
                        description: Number of notifications actually marked as read (max 500 per request when all=true).
                        example: 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # BILLING
  # ===========================================================================
  /api/v1/workspaces/{wid}/billing/checkout:
    post:
      tags: [billing]
      summary: Create a Stripe Checkout Session (upgrade)
      description: >
        Owner only (AC-05). Creates a Stripe Checkout Session (mode=subscription) for the
        workspace plan; quantity is derived from `Workspace.seatLimit`. Returns the redirect
        URL. `priceId` defaults to env STRIPE_PRICE_ID. On checkout.session.completed the
        webhook writes the Subscription row and sets plan='pro'.
      operationId: createCheckout
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout session created (redirect URL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Checkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/PaymentNotConfigured'

  /api/v1/workspaces/{wid}/billing/status:
    get:
      tags: [billing]
      summary: Get current plan + seat usage + subscription status
      description: >
        Returns Workspace.plan, seatLimit, current member count, and the Subscription
        status (for the billing page). Used by the frontend Billing view.
      operationId: billingStatus
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Billing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_BillingStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/billing/portal:
    post:
      tags: [billing]
      summary: Create a Stripe Customer Portal session
      description: >
        Owner only. Returns a Stripe Billing Portal URL so the customer can update payment
        method / cancel. Requires an existing Stripe customer (from a completed checkout).
      operationId: billingPortal
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Checkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/PaymentNotConfigured'

  /api/v1/billing/webhook:
    post:
      tags: [billing]
      summary: Stripe webhook receiver
      description: >
        Verified by the `Stripe-Signature` header (webhook secret). Handles
        checkout.session.completed (workspace existence check, upsert Subscription +
        plan=pro), customer.subscription.updated (sync quantity, AC-08), and
        invoice.payment_failed (mark past_due, AC-09 — no immediate service
        interruption). The raw request body is required for signature verification.
      security:
        - stripeSignature: []
      operationId: billingWebhook
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_WebhookReceived'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===========================================================================
  # EVENTS
  # ===========================================================================
  /api/v1/events:
    post:
      tags: [events]
      summary: Batch-ingest client analytics events (max 50)
      description: >
        Rate-limited to 120 req/min per IP. Events are filtered against a whitelist
        aligned with the P2 funnel (register_*/login_*/onboarding_*/create_task/
        invite_member/create_decision/create_comment/task_status_change/page_view/
        workspace_switch/billing_*); non-whitelisted names are silently dropped.
        Anonymous events are allowed (userId=null); workspaceId comes from the token
        unless overridden by the event payload. Props must not contain PII.
      security:
        - bearerAuth: []
        - {}
      operationId: ingestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 64 }
                      props: { type: object, default: {} }
                      sessionId: { type: string, maxLength: 64 }
                      workspaceId: { type: string, format: uuid }
      responses:
        '200':
          description: Ingestion result ({ accepted } count)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      accepted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [events]
      summary: "[DEV ONLY] List the current user's recent events"
      description: >
        Debug helper returning the caller's last 50 events. Disabled in production
        with 403; use /workspaces/{wid}/analytics/overview there instead.
      operationId: listMyEvents
      responses:
        '200':
          description: Recent events wrapped in the uniform envelope (dev only)
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: integer
                    description: Business status code, mirrors HTTP status code.
                    example: 200
                  data:
                    type: array
                    description: The caller's last 50 analytics events.
                    items:
                      type: object
                      description: Analytics event record (dev only).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # SYSTEM / UPLOADS
  # ===========================================================================
  /api/health:
    get:
      tags: [system]
      summary: Liveness + DB readiness probe
      responses:
        '200':
          description: App alive and database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "ok" }
                      db: { type: string, example: "up" }
                      uptimeSec: { type: integer, description: Process uptime in seconds }
        # L3：DB 探测失败时实现返回 503 + { status: "degraded", db: "down" }，
        # 此前 openapi 未定义 503，客户端无法预知降级形状。这里补全契约。
        '503':
          description: Database unreachable (degraded)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: integer, example: 503 }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: "degraded" }
                      db: { type: string, example: "down" }
                  message: { type: string, example: "Database unreachable" }
  # Prometheus 指标端点：输出 Prometheus 0.0.4 文本格式（非 JSON 信封）。
  # 默认开放（Prometheus scraper 无 cookie）；设置 METRICS_TOKEN 后要求 Bearer 令牌。
  /api/metrics:
    get:
      tags: [system]
      summary: Prometheus metrics exposition (text/plain)
      description: >-
        Returns process metrics in Prometheus exposition format
        (corps_uptime_seconds, corps_memory_*_bytes, corps_node_version,
        corps_process_pid). When METRICS_TOKEN is set, a request without
        `Authorization: Bearer <token>` is rejected with 401.
      security:
        - {}
        - metricsToken: []
      responses:
        '200':
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: METRICS_TOKEN is set and the Bearer token is missing/invalid
  /api/cron/due-reminders:
    get:
      tags: [system]
      summary: Send due-task reminder emails (daily cron, Bearer CRON_SECRET)
      security:
        - cronSecret: []
      responses:
        '200': { description: Reminder job summary }
        '401': { description: Missing/invalid CRON_SECRET }
  /api/cron/weekly-digest:
    get:
      tags: [system]
      summary: Send weekly task digest emails to Pro workspace members (Bearer CRON_SECRET)
      description: >
        Pro feature (v2 pricing 2026-09-02). Scans only workspaces with an active
        Pro subscription and sends each member a digest of overdue tasks plus tasks
        due in the next 7 days. Members with no relevant tasks are skipped. Also
        aggregates weekly operational funnel stats (registers/activations/taskCreates/
        pageViews) per workspace for the owner. Graceful degradation: when email is
        not configured, returns sent=0 with reason=email_not_configured.
        Suggested schedule: Monday 02:00 UTC.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Weekly digest job summary (sent/skipped/proWorkspaces/stats)
        '401': { description: Missing/invalid CRON_SECRET }
        '500': { description: CRON_SECRET not configured or internal error }
  /api/cron/cleanup-uploads:
    get:
      tags: [system]
      summary: Remove orphaned IM attachment files not referenced by message_attachments (Bearer CRON_SECRET)
      description: >
        Audit P2 cleanup. Compares web/uploads/ against message_attachments url
        references and deletes on-disk files with no DB record. Idempotent and safe:
        orphans only waste space. Suggested schedule: weekly.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Cleanup summary (deleted/kept counts)
        '401': { description: Missing/invalid CRON_SECRET }
        '500': { description: CRON_SECRET not configured or internal error }
  /api/cron/check-expired-permissions:
    get:
      tags: [system]
      summary: Revoke expired temporary permission grants (hourly cron, Bearer CRON_SECRET)
      description: >
        Scans all TemporaryGrant records where expiresAt < now(). For each
        expired grant, restores the member's role to originalRole (only if
        current role still matches tempRole, to avoid overwriting manual role
        changes) and deletes the grant record. All steps run in a single
        transaction. Returns { checked, restored, skipped }.
        Suggested schedule: hourly.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Expired grants processed (checked/restored/skipped counts)
        '401': { description: Missing/invalid CRON_SECRET }
        '500': { description: CRON_SECRET not configured or internal error }
  /api/cron/check-overdue-actions:
    get:
      tags: [system]
      summary: Send overdue action item notifications (daily cron, Bearer CRON_SECRET)
      description: >
        Scans all incomplete and overdue DecisionActionItems with an associated
        non-done task. For each overdue item with an assignee, creates an
        in-app Notification (type: action_overdue, deduplicated by entityId).
        Returns { checked, notified, skipped }.
        Suggested schedule: daily at 09:00.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Overdue action items processed (checked/notified/skipped counts)
        '401': { description: Missing/invalid CRON_SECRET }
        '500': { description: CRON_SECRET not configured or internal error }
  /api/uploads/{path+}:
    get:
      tags: [uploads]
      summary: Serve an uploaded attachment (login + tenant membership required)
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: File bytes }
        '401': { description: Not authenticated }
        '403': { description: Not a member of the attachment workspace }
        '404': { description: Attachment not found or orphaned }
  /api/tasks/share/{token}:
    get:
      tags: [tasks]
      summary: Public read-only task share (no login required)
      description: >
        Resolves a task by its share token (24-byte base64url, 192-bit entropy) and
        returns title/description/status/priority/dueDate plus subtask progress and
        assignee display name. Desensitized: never exposes assignee.email, creator,
        comments, chat messages or attachments. RLS hardened mode reads via
        app.public_token so FORCE RLS cannot be bypassed. Revoke by PATCHing the
        task with shareToken=null.
      security: []
      operationId: getSharedTask
      parameters:
        - name: token
          in: path
          required: true
          description: Share token (24-byte base64url).
          schema: { type: string }
      responses:
        '200':
          description: Shared task detail (desensitized, with subtasks + assignee name)
        '404':
          description: Share link invalid or revoked
        '500':
          description: Internal server error
  /api/documents/share/{token}:
    get:
      tags: [documents]
      summary: Public read-only document share (no login required)
      description: >
        Returns document metadata plus the published snapshot (publishedMarkdown).
        A document with no publishedMarkdown (never published / draft) returns 404 —
        drafts are not shareable. Token is 24-byte base64url (192-bit entropy);
        revoke by PATCHing with shareToken=null. RLS hardened mode reads via
        app.public_token; field whitelist omits author.email and other sensitive
        fields.
        Access gating is enforced **server-side**: when the share has a password or
        has passed shareExpiresAt, publishedMarkdown is withheld (empty string) and
        the caller must obtain the body from the /verify endpoint below. The
        response never carries the password hash itself.
      security: []
      operationId: getSharedDocument
      parameters:
        - name: token
          in: path
          required: true
          description: Share token (24-byte base64url).
          schema: { type: string }
      responses:
        '200':
          description: >
            Shared document metadata; publishedMarkdown is empty when the share is
            password-protected or expired
        '404':
          description: Share link invalid, revoked, or document never published
        '500':
          description: Internal server error
  /api/documents/share/{token}/verify:
    post:
      tags: [documents]
      summary: Unlock a password-protected / expired public share
      description: >
        Public counterpart to the GET above — the share page posts here when the
        GET response reports hasPassword (or when the caller wants the body after
        an expiry check). Verifies the password against the stored scrypt hash,
        re-checks shareExpiresAt server-side, records a ShareAccessLog row, and
        returns the body only on success. Failed attempts count towards an
        IP-scoped lockout (3 failures → temporary 429).
      security: []
      operationId: verifySharedDocument
      parameters:
        - name: token
          in: path
          required: true
          description: Share token or custom slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Unlocked document body (id + title + markdown)
        '400':
          description: Missing or malformed password
        '401':
          description: Password incorrect (counts towards lockout)
        '403':
          description: Share link expired
        '404':
          description: Share link invalid or document never published
        '429':
          description: Too many failed attempts from this IP
        '500':
          description: Internal server error
