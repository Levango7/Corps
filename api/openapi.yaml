  # ===========================================================================
  # DOMESTIC PAYMENT WEBHOOKS
  # ===========================================================================
  /api/v1/billing/webhook/alipay:
    post:
      tags: [billing]
      summary: Alipay payment callback (signature verified)
      responses:
        '200': { description: Accepted }
        '400': { description: Signature error }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/billing/webhook/wechat:
    post:
      tags: [billing]
      summary: WeChat Pay V3 callback (HMAC-SHA256 verified)
      responses:
        '200': { description: Accepted (code=0) }
        '400': { description: Signature error }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workspaces/{wid}/tasks/{id}/calendar-sync:
    get:
      tags: [calendar]
      summary: Get calendar sync state for a task
      responses:
        '200': { description: Sync state }
        '401': { description: Unauthorized }
  /api/v1/workspaces/{wid}/decisions:
    get:
      tags: [decisions]
      summary: List decisions across all tasks in the workspace
      description: >
        Aggregated decision list for the workspace (all tasks), newest first, paginated.
        Query params: page (default 1), limit (default 20, max 50), q (case-insensitive
        keyword search over markdown content, PostgreSQL ilike semantics).
        Note: the success response returns { code, data } only — `message` is omitted
        (Envelope.message is optional for 2xx responses).
      operationId: listWorkspaceDecisions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated decision list (taskTitle/authorName joined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DecisionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/request-password-reset:
    post:
      tags: [auth]
      summary: Request a password reset email (Better Auth hosted)
      description: >
        Body: { email, redirectTo }. Sends a one-time reset link (valid 1h) when the
        address exists. Always 200 regardless of existence (anti-enumeration). Requires
        the sendResetPassword callback configured server-side (lib/auth.ts).
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                redirectTo: { type: string }
      responses:
        '200': { description: Accepted (anti-enumeration) }
        '429': { description: Rate limited }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Reset the password with a one-time token (Better Auth hosted)
      description: >
        Body: { newPassword (min 8), token }. Consumes the one-time token from the
        email link (/auth/reset-password?token=...). Invalid/expired -> 400 INVALID_TOKEN.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword, token]
              properties:
                newPassword: { type: string, minLength: 8 }
                token: { type: string }
      responses:
        '200': { description: Password updated }
        '400': { description: Invalid or expired token (INVALID_TOKEN) }

  # ===========================================================================
  # WORKSPACE OWNERSHIP TRANSFER
  # ===========================================================================
  /api/v1/workspaces/{wid}/transfer-ownership:
    patch:
      tags: [workspaces]
      summary: Transfer workspace ownership to another member (owner only)
      description: >
        Owner-only (non-owner → 403). Body: { newOwnerUserId (UUID) }. The transferee
        must already be a member of the workspace; otherwise 400 transfereeNotMember.
        Self-transfer is rejected (400 alreadyOwner). On success the transferee becomes
        `owner` and the original owner is demoted to `admin`; workspace.ownerId is
        updated atomically inside the tenant transaction.
      operationId: transferWorkspaceOwnership
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerUserId]
              properties:
                newOwnerUserId: { type: string, format: uuid }
                password:
                  type: string

                  description: >-
                    Current owner's password for二次确认（有密码账户必填，OAuth 账户可省略）.
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error

  # ===========================================================================
  # WORKSPACE DOCUMENTS
  # ===========================================================================
  /api/v1/workspaces/{wid}/documents:
    get:
      tags: [documents]
      summary: List documents in a workspace
      description: >
        Returns documents ordered by updatedAt desc with pagination. Query params:
        q (case-insensitive keyword search over title / markdown / publishedMarkdown),
        mine=1 (only documents authored by the caller),
        page (default 1), limit (default 50, max 100). Response envelope uses the
        unified R8C-06 shape: data.{items,page,limit,total,hasMore}.
      operationId: listWorkspaceDocuments
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: q
          in: query
          schema: { type: string }
        - name: mine
          in: query
          schema: { type: string, enum: ['1'] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    required: [items, page, limit, total, hasMore]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            publishedAt: { type: string, format: date-time, nullable: true }
                            updatedAt: { type: string, format: date-time }
                            author:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                email: { type: string }
                      total:
                        type: integer
                        description: Total count of documents matching the query.
                      page:
                        type: integer
                        description: Current page number.
                      limit:
                        type: integer
                        description: Page size used for this query.
                      hasMore: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
    post:
      tags: [documents]
      summary: Create a document in a workspace
      description: >
        Body: { title (1-255 chars), markdown? (defaults to empty string) }. Returns
        the created document with 201.
      operationId: createWorkspaceDocument
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                markdown: { type: string }
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 201 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                      markdown: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error

  /api/v1/workspaces/{wid}/documents/{id}:
    get:
      tags: [documents]
      summary: Get a document detail (edit view)
      description: >
        Returns the document draft markdown plus publishedMarkdown (if any) and
        shareToken state for the UI. Membership required; unknown document → 404.
      operationId: getWorkspaceDocument
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: id
          in: path
          required: true
          description: Document id (UUID).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                      markdown: { type: string }
                      publishedMarkdown: { type: string, nullable: true }
                      publishedAt: { type: string, format: date-time, nullable: true }
                      shareToken: { type: string, nullable: true }
                      author:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          email: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
    patch:
      tags: [documents]
      summary: Update a document (title / markdown / publish / shareToken)
      description: >
        Partial update. Body: { title?, markdown?, publish?, shareToken? }.
        publish=true snapshots current markdown into publishedMarkdown and stamps
        publishedAt. shareToken="rotate" generates a new server-side token (old link
        invalidated); shareToken=null cancels sharing. Unknown document → 404.
      operationId: updateWorkspaceDocument
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: id
          in: path
          required: true
          description: Document id (UUID).
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                markdown: { type: string }
                publish: { type: boolean }
                shareToken:
                  type: string
                  nullable: true
                  enum: [rotate]
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                      markdown: { type: string }
                      publishedMarkdown: { type: string, nullable: true }
                      shareToken: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
    delete:
      tags: [documents]
      summary: Delete a document
      description: Removes the document from the workspace. Unknown document → 404.
      operationId: deleteWorkspaceDocument
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: id
          in: path
          required: true
          description: Document id (UUID).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error

  # AI 可用性探测：供客户端按钮在挂载时判断 AI 是否已配置，
  # 未配置时按钮置灰而不是点击后才收到 503。仅返回布尔值，不泄露密钥。
  # 需要登录（匿名探测 → 401）。
  /api/v1/ai/configured:
    get:
      tags: [ai]
      summary: Check whether the AI provider is configured (boolean only)
      operationId: getAiConfigured
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      configured: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # AI AGENTS（2026-10-25 清偿 5 条）
  #
  # 依据：web/app/api/v1/ai/agents*/route.ts 的**文件头注释**（方法 / 入参 /
  # 出参 / 限流都写在里面）。凡注释未写明的字段，这里只标 type: object，
  # 不猜字段名 —— 契约写错比不写更危险：它会让人以为已经对齐了。
  # 这组路由的 workspace 走 **query 参数 wid**（不是路径段），与
  # /api/v1/workspaces/{wid}/... 那一族不同。
  # ===========================================================================
  /api/v1/ai/agents:
    get:
      tags: [ai]
      summary: List agents of a workspace
      description: >
        Query: wid (required), enabled (optional boolean filter).
        Returns agents of the workspace ordered by creation time ascending.
      operationId: listAiAgents
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
        - name: enabled
          in: query
          required: false
          description: Filter by enabled flag.
          schema: { type: boolean }
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ai]
      summary: Create an agent
      description: >
        Rate limit is not declared for this route. Auth chain:
        getUserId → getWorkspaceContextV2 → runWithWorkspace (RLS transaction).
        capabilities/metadata are converted with Prisma.InputJsonValue.
      operationId: createAiAgent
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, capabilities, systemPrompt, model]
              properties:
                name: { type: string }
                role: { type: string }
                capabilities:
                  description: Free-form capability list; stored as JSON.
                  type: array
                  items: { type: object }
                systemPrompt: { type: string }
                model: { type: string }
                enabled: { type: boolean }
                metadata: { type: object }
      responses:
        '200':
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/agents/coordinate:
    post:
      tags: [ai]
      summary: Coordinate multiple agents to execute a task (non-streaming)
      description: >
        Rate limit: 3 requests per minute.
        Returns { assignments, responses, messages }. Agents are selected by
        agentIds when provided, otherwise all enabled agents of the workspace.
      operationId: coordinateAiAgents
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string }
                agentIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Coordination result
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    description: '{ assignments, responses, messages }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/ai/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    patch:
      tags: [ai]
      summary: Update an agent (partial)
      description: >
        Every body field is optional; only supplied fields are updated.
        Scoped by workspaceId + id so a caller can only touch agents of its
        own workspace.
      operationId: updateAiAgent
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                capabilities:
                  type: array
                  items: { type: object }
                systemPrompt: { type: string }
                model: { type: string }
                enabled: { type: boolean }
                metadata: { type: object }
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ai]
      summary: Delete an agent
      operationId: deleteAiAgent
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ai/agents/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [ai]
      summary: List agent message history
      description: >
        Query: wid (required), from / to (optional agent ids), type (optional),
        take (default 50), skip (default 0).
      operationId: listAiAgentMessages
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Filter by sender agent id.
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: false
          description: Filter by recipient agent id.
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: false
          description: Filter by message type.
          schema: { type: string }
        - name: take
          in: query
          required: false
          description: Page size (default 50).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: skip
          in: query
          required: false
          description: Offset (default 0).
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/agents/{id}/respond:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [ai]
      summary: Get a single agent response (non-streaming)
      description: >
        Rate limit: 10 requests per minute.
        Returns { response, handoff, messageId }.
      operationId: respondAiAgent
      security:
        - bearerAuth: []
      parameters:
        - name: wid
          in: query
          required: true
          description: Workspace id. Must equal the JWT `wid` claim; mismatch is 403.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    description: '{ response, handoff, messageId }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ===========================================================================
  # DECISION EXTRACT (AI draft)
  # ===========================================================================
  /api/v1/workspaces/{wid}/decisions/extract:
    post:
      tags: [decisions]
      summary: Extract a decision draft from source text (rules-based AI)
      description: >
        Member and above only (viewer → 403). Body: { sourceText (10-20000 chars) }.
        Returns a structured decision draft { title, markdown, suggestedTags, provider }.
        Current implementation is a rules-based template extractor (provider=rules-v1);
        the backend may swap in a real LLM later without breaking this contract.
      operationId: extractDecision
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceText]
              properties:
                sourceText:
                  type: string
                  minLength: 10
                  maxLength: 20000
      responses:
        '200':
          description: Decision draft extracted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      title: { type: string }
                      markdown: { type: string }
                      suggestedTags:
                        type: array
                        items: { type: string }
                      provider: { type: string, example: rules-v1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error

  # ===========================================================================
  # ACCOUNT DELETION (privacy compliance)
  # ===========================================================================
  /api/v1/users/me/account:
    get:
      tags: [users]
      summary: Preview data before account deletion
      description: >
        Returns a preview of what will be removed: owned workspaces, joined workspaces,
        calendar connections, subscriptions and data-volume stats. Used by the
        "delete account" confirmation dialog.
      operationId: previewAccountDeletion
      responses:
        '200':
          description: Deletion preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    description: Preview of resources that will be deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
    delete:
      tags: [users]
      summary: Delete the current user's account
      description: >
        Body: { confirmEmail }. The email must match the account email
        (case-insensitive); mismatch → 400 accountEmailMismatch and nothing is deleted.
        On success: owned workspaces are tenant-deleted, joined workspaces only leave
        membership, calendar tokens revoked, Better Auth session/account purged, and
        the access_token cookie is expired. A notification email is sent best-effort.
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmEmail]
              properties:
                confirmEmail: { type: string, format: email }
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean, example: true }
                      deletedWorkspaces:
                        type: array
                        items: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error

  # ===========================================================================
  # F3: DASHBOARD (widget layout & widget data)
  # ===========================================================================
  /api/v1/workspaces/{wid}/dashboard/layout:
    get:
      tags: [Dashboard]
      summary: Get the caller's dashboard layout for a workspace
      description: >
        Returns the persisted react-grid-layout items for the calling user within
        the workspace, plus the active breakpoint label. Each user has an independent
        layout per workspace; membership required. Unknown workspace → 404.
      operationId: getDashboardLayout
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Dashboard layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DashboardLayout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Dashboard]
      summary: Save the caller's dashboard layout for a workspace
      description: >
        Upserts the react-grid-layout items for the calling user within the workspace.
        Body: { layout: RGLItem[], breakpoint?: string }. The layout array may be
        empty to reset to defaults. Unknown workspace → 404.
      operationId: saveDashboardLayout
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardLayoutUpdateRequest'
      responses:
        '200':
          description: Layout saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DashboardLayout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # F3: Dashboard layout export/import (template sharing)
  /api/v1/workspaces/{wid}/dashboard/layout/export:
    get:
      tags: [Dashboard]
      summary: Export the caller's dashboard layout as a shareable template
      description: >
        Returns a JSON template object containing the caller's current
        react-grid-layout items, widget configurations, and the active
        breakpoint. The template can be shared with other users and imported
        via the /layout/import endpoint. Membership required; unknown workspace
        → 404.
      operationId: exportDashboardLayout
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Layout template exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      layout:
                        type: array
                        items:
                          $ref: '#/components/schemas/RGLItem'
                      widgetConfigs:
                        type: object
                        additionalProperties: true
                        description: Widget configurations keyed by widgetId.
                      name:
                        type: string
                        description: Auto-generated template name (workspace id + date).
                      exportedAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/dashboard/layout/import:
    post:
      tags: [Dashboard]
      summary: Import a dashboard layout template
      description: >
        Replaces the caller's current dashboard layout with the provided
        template. The template must match the export schema (version, layout,
        configs). Widget IDs that do not exist in the workspace will be ignored
        (with a warning in the response). Membership required; unknown workspace
        → 404. The import is atomic — either all items are applied or none.
      operationId: importDashboardLayout
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                version:
                  type: string
                  description: Template version (for forward compatibility).
                breakpoint:
                  type: string
                  description: Active breakpoint label (e.g. lg, md, sm).
                layout:
                  type: array
                  items:
                    $ref: '#/components/schemas/RGLItem'
                configs:
                  type: object
                  additionalProperties: true
                  description: Widget configurations keyed by widgetId.
      responses:
        '200':
          description: Layout imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      layout:
                        type: array
                        items:
                          $ref: '#/components/schemas/RGLItem'
                      widgetConfigs:
                        type: object
                        additionalProperties: true
                        description: Widget configurations keyed by widgetId.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/dashboard/widgets/{widgetId}:
    get:
      tags: [Dashboard]
      summary: Get widget data (dynamic per widget kind)
      description: >
        Returns the computed data payload for a single widget. The shape of `data`
        varies by widget kind. Supported widgetId values: tasks-summary
        (returns {total, byStatus}), team-load, burndown (returns {points: [...]}),
        priority-dist, recent-activity (returns {items: [...]}), gantt-chart,
        milestone-timeline, custom-chart. The client must branch on widgetId/kind.
        Membership required; unknown workspace or widget → 404.
      operationId: getDashboardWidgetData
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget data (dynamic shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_WidgetData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # F4: Batch document export (merge multiple documents into one PDF/HTML)
  /api/v1/workspaces/{wid}/documents/batch-export:
    post:
      tags: [Documents]
      summary: Batch export multiple documents as a single merged file
      description: >
        Exports multiple workspace documents as one merged HTML/PDF file. The
        response contains the full HTML document with a table-of-contents
        section and one section per document. The client can open the print
        dialog (Save as PDF) to produce the final PDF. Membership required;
        unknown workspace → 404. All documentIds must belong to the workspace;
        unknown IDs are silently skipped. Maximum 100 documents per batch.
      operationId: batchExportDocuments
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              properties:
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100
                  description: Document IDs to include in the batch export.
                format:
                  type: string
                  enum: [pdf, html]
                  default: pdf
                  description: Output format (pdf triggers print CSS; html returns raw).
                includeTableOfContents:
                  type: boolean
                  default: true
                  description: Whether to prepend a table-of-contents page.
      responses:
        '200':
          description: Batch export generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      html:
                        type: string
                        description: Merged HTML document (TOC + all document sections).
                      documentCount:
                        type: integer
                        description: Number of documents actually included.
                      skippedIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: Document IDs that were skipped (not found).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # F5: SHARING — documents
  # ===========================================================================
  /api/v1/workspaces/{wid}/documents/{id}/share:
    get:
      tags: [Sharing]
      summary: Get share settings for a document
      description: >
        Returns the current share configuration for the document: shareToken,
        shareExpiresAt, and hasPassword (boolean presence flag, never the raw
        value). Membership required; unknown document → 404.
      operationId: getDocumentShareSettings
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Share settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Sharing]
      summary: Update share settings for a document
      description: >
        Partial update of share configuration. Body may include any subset of:
        shareExpiresAt (ISO-8601, nullable to clear), sharePassword (string,
        nullable to clear). Unknown document → 404.
      operationId: updateDocumentShareSettings
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSettingsUpdateRequest'
      responses:
        '200':
          description: Updated share settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/documents/{id}/versions/compare:
    post:
      tags: [Documents]
      summary: Compare two document versions (line-level diff)
      description: >
        Authenticated endpoint (workspace membership required). Body:
        { fromVersionId, toVersionId }. Returns line-level diff plus statistics.
        Either version missing or not belonging to the document → 404.
      operationId: compareDocumentVersions
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromVersionId, toVersionId]
              properties:
                fromVersionId:
                  type: string
                  format: uuid
                toVersionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Diff computed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                  stats:
                    type: object
                    properties:
                      added:
                        type: integer
                      removed:
                        type: integer
                      unchanged:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/documents/{id}/versions/{versionId}/restore:
    post:
      tags: [Documents]
      summary: Restore a document to a previous version (forced snapshot)
      description: >
        Authenticated endpoint requiring write permission. Before overwriting the
        current content, it is snapshotted as a new version so the rollback stays
        reversible. Body: { source?, message? } — both are ignored, the server
        always writes its own values (snapshot step cannot be skipped by request
        parameters). Viewer (read-only role) → 401/403. Unknown version → 404.
      operationId: restoreDocumentVersion
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Ignored; server forces its own value
                message:
                  type: string
                  description: Ignored; server forces its own value
      responses:
        '200':
          description: Restored successfully; snapshot of previous content created
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/documents/{id}/share/verify:
    post:
      tags: [Sharing]
      summary: Verify share password for a document
      description: >
        Authenticated endpoint (workspace membership required) used by members to
        preview a password-protected document share. Body: { password }. On
        success returns the document content { id, title, markdown }; on mismatch
        returns 401. Unknown/expired/disabled share → 404. Public (no-login)
        access uses the /api/documents/share/{token} path instead.
      operationId: verifyDocumentSharePassword
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVerifyRequest'
      responses:
        '200':
          description: Password verified; access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/documents/{id}/share/logs:
    get:
      tags: [Sharing]
      summary: List share access logs for a document
      description: >
        Returns paginated access log entries (viewer IP, user agent, accessedAt)
        for the document's share link. Owner/admin only; unknown document
        → 404. Query params: page (default 1), pageSize (default 20, max 100).
      operationId: listDocumentShareLogs
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/DocumentId'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Share access logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareAccessLogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # F5: SHARING — tasks
  # ===========================================================================
  /api/v1/workspaces/{wid}/tasks/{id}/share:
    get:
      tags: [Sharing]
      summary: Get share settings for a task
      description: >
        Returns the current share configuration for the task (same shape as document
        share settings). Membership required; unknown task → 404.
      operationId: getTaskShareSettings
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Share settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Sharing]
      summary: Update share settings for a task
      description: >
        Partial update of share configuration for a task. Same body shape as the
        document share update. Unknown task → 404.
      operationId: updateTaskShareSettings
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSettingsUpdateRequest'
      responses:
        '200':
          description: Updated share settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{wid}/tasks/{id}/share/verify:
    post:
      tags: [Sharing]
      summary: Verify share password for a task
      description: >
        Authenticated endpoint (workspace membership required) used by members to
        preview a password-protected task share. Body: { password }. On success
        returns the task content { id, title, markdown }; on mismatch returns
        401. Unknown/expired/disabled share → 404. Public (no-login) access uses
        the /api/tasks/share/{token} path instead.
      operationId: verifyTaskSharePassword
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVerifyRequest'
      responses:
        '200':
          description: Password verified; access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ShareVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/favorites:
    get:
      tags: [Favorites]
      summary: List the current user's favorites in a workspace
      description: >
        Per-user bookmarks (task/document/message/wiki/whiteboard/form/meeting).
        Scoped to the caller's workspace membership; `wid` is required and the
        response only contains the caller's own rows.
      operationId: listFavorites
      parameters:
        - name: wid
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            type: string
            enum: [task, document, message, wiki, whiteboard, form, meeting]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Current user's favorites (createdAt desc)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        targetType: { type: string }
                        targetId: { type: string, format: uuid }
                        note: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Favorites]
      summary: Add a favorite
      operationId: createFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wid, targetType, targetId]
              properties:
                wid: { type: string, format: uuid }
                targetType:
                  type: string
                  enum: [task, document, message, wiki, whiteboard, form, meeting]
                targetId: { type: string, format: uuid }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Created favorite
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      targetType: { type: string }
                      targetId: { type: string, format: uuid }
                      note: { type: string, nullable: true }
                      createdAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/notifications/unread:
    get:
      tags: [Notifications]
      summary: Unread notifications for the current user in a workspace
      description: >
        Returns the unread count plus up to `limit` newest unread items.
        Per-user: only the caller's notifications are returned.
      operationId: listUnreadNotifications
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Unread count and items
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            type: { type: string }
                            entityId: { type: string }
                            entityTitle: { type: string }
                            read: { type: boolean }
                            createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/workspaces/{wid}/settings/modules:
    patch:
      tags: [Settings]
      summary: Toggle which optional sidebar modules a workspace pins
      description: >
        Full replacement of the enabled set (not a delta). Ids must be optional
        modules (see DEFAULT_VISIBLE_MODULE_IDS for the always-visible core);
        unknown/duplicate ids are rejected with 400 and listed in
        `data.invalidModules`. Empty list = every optional module stays under
        “More”. Requires `settings:update` (owner).
      operationId: updateWorkspaceModuleSettings
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabledModules]
              properties:
                enabledModules:
                  type: array
                  maxItems: 64
                  items: { type: string }
      responses:
        '200':
          description: Saved enabled set
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      enabledModules:
                        type: array
                        items: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires settings:update (owner)
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces/{wid}/activity:
    get:
      tags: [activity]
      summary: Workspace activity feed (recent task/comment/decision changes)
      description: >
        Aggregates the most recent task.created / task.updated / comment.created /
        decision.created / decision.updated events into one feed, newest first.
        A just-created item never appears again as "updated". Page size is fixed
        at 20; pass the previous page's nextCursor to fetch older items.
      operationId: listWorkspaceActivity
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: cursor
          in: query
          schema: { type: string, format: date-time }
          description: Return activities strictly older than this ISO timestamp.
      responses:
        '200':
          description: One activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ActivityFeed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workspaces/{wid}/announcements:
    get:
      tags: [announcements]
      summary: List announcements (pinned first, then newest published)
      operationId: listAnnouncements
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: type
          in: query
          schema: { type: string, enum: [info, warning, urgent] }
        - name: pinned
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: Literal "true"/"false" string filter.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Announcement list (paginated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AnnouncementList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [announcements]
      summary: Create an announcement
      description: Requires announcements:create in the permission matrix.
      operationId: createAnnouncement
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: Announcement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Announcement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workspaces/{wid}/announcements/{aid}:
    get:
      tags: [announcements]
      summary: Announcement detail
      operationId: getAnnouncement
      parameters:
