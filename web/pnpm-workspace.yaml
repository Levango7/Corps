allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  better-sqlite3: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.80"
  - "@ai-sdk/mcp@2.0.49"
  - "@ai-sdk/provider-utils@5.0.40"
  - "@ai-sdk/provider@4.0.14"
  - "@ai-sdk/react@4.0.102"
  - ai@7.0.99
overrides:
  # MySQL2 auth plugin 降级泄露明文凭据（GHSA-3f6p-5ww8-9rcr，high，<3.22.0）。
  # better-auth 的可选 peer 会把 mysql2 解析进锁文件（本项目用 pg，mysql2 实际不加载）。
  # Prisma 7 升级批次连带暴露，收敛到修复版下界。
  mysql2: ">=3.22.0"
  effect: ^3.20.0
  deepmerge-ts: ^8.0.0
  # 注意：pnpm 在 web/ 下安装时只读本文件（CI 的 working-directory: web、
  # Dockerfile 的构建上下文 ./web 都属这种情况）。仓库根 pnpm-workspace.yaml 里的
  # overrides 不会进锁文件——此前那条 sharp 覆盖就是死配置，故在此重述一遍。
  # sharp >=0.35.5 修 GHSA-rgj7-g3m4-5g8c（libheif）+ CVE-2026-96889（librsvg，high，2026-10-06 出新公告）
  # 这条是**手写 override 下界**：dependabot 只 bump package.json 的直接依赖、不会来抬它，
  # 所以每次上游出新公告都要人工抬一次下界（同一天被 tinypool、sharp 连着咬两次）。
  sharp: ">=0.35.5"
  # undici 三条 high（DoS via unrequested WebSocket subprotocol / TLS 证书校验绕过 /
  # cross-origin cache poisoning）分属两个大版本，各自按声明范围覆盖并**加上界**：
  # 若写成 ">=7.29.1" 无上界，pnpm 会把 7.x 的请求解析到 8.10.0 —— 既跨了大版本、
  # 又仍是未修复版本（实测踩过）。故两条都锁在本大版本内。
  #   @ai-sdk/provider-utils 声明 ^7.29.0 → 修复版 7.29.1（<8 保住大版本）
  #   jsdom（经 vitest 带入，且被 --prod 审计计入）声明 ^8.9.0 → 修复版 >=8.10.2
  "undici@^7.29.0": ">=7.29.1 <8"
  "undici@^8.9.0": ">=8.10.2 <9"
  # tinypool 两条 critical（GHSA-5gmw-xhrv-c9v3 等：worker options 的原型污染 gadget → RCE）
  # 只有 2.1.2+ 修了，而 vitest 3.2.7 声明的是 ^1.1.1；升 vitest 到 4 能自然摆脱 tinypool，
  # 但 v4 把覆盖率统计口径改成"include 命中的全部 712 个文件"（实测 total functions
  # 59.33% → 5.78%），等于逼两道门重新定标，所以这里先只顶依赖、把 vitest 留在 3.2.7。
  # 加 <3 上界是照 undici 那两行的教训：无上界会把请求解析到未修复或跨大版本的版本。
  # 这个组合越过了 vitest 自己声明的范围，必须由测试跑通来背书——见本轮单测计数。
  tinypool: ">=2.1.2 <3"
  # source-map-js 1.2.1 = GHSA-68fv-2mgg-jv7q（high：source-map section 偏移可造成事件循环 DoS），
  # 1.2.2 是同大版本补丁；引入方是 prisma CLI（magicast）与 tailwind（postcss），都被 --prod 计入。
  source-map-js: ">=1.2.2"
