version: "3.8"

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: corps-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme-dev-only
      POSTGRES_DB: corps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-rls.sql:/docker-entrypoint-initdb.d/01-init-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corps"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
