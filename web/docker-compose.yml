version: "3.8"

# 本地开发用：仅提供 PostgreSQL。Next.js 应用直接 `pnpm dev` 运行，
# 不在 compose 内编排（RLS 生产加固见 db/schema.sql 的 ACTIVATION 一节）。

services:
  postgres:
    # 版本与根目录 docker-compose.yml、CI（postgres:18）保持一致
    # 注意：若旧数据卷为 PG16 数据目录，需先 docker compose down -v 重建（见 docs/runbook-deploy.md §6）
    image: postgres:18-alpine
    container_name: corps-postgres
    environment:
      # 可用环境变量覆盖：POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
      POSTGRES_DB: corps
    ports:
      - "5432:5432"
    volumes:
      # PG18+ 镜像要求数据卷挂载到 /var/lib/postgresql（主版本子目录布局）
      - postgres_data:/var/lib/postgresql
      - ./docker/init-rls.sql:/docker-entrypoint-initdb.d/01-init-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corps"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
